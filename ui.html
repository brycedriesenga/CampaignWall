<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root {
  --bg: var(--figma-color-bg, #ffffff);
  --bg2: var(--figma-color-bg-secondary, #f5f5f5);
  --bg3: var(--figma-color-bg-tertiary, #ebebeb);
  --text: var(--figma-color-text, #1e1e1e);
  --muted: var(--figma-color-text-secondary, #6b6b6b);
  --border: var(--figma-color-border, #e3e3e3);
  --brand: var(--figma-color-bg-brand, #0d99ff);
  --onbrand: var(--figma-color-text-onbrand, #ffffff);
  --danger: var(--figma-color-text-danger, #dc3412);
  --warn-bg: var(--figma-color-bg-warning-tertiary, #fff3d6);
  --warn: var(--figma-color-text-warning, #8a5300);
  --ok: var(--figma-color-text-success, #14804a);
  --ink: var(--figma-color-bg-inverse, #1e1e1e);
  --onink: var(--figma-color-text-oninverse, #ffffff);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font: 12px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.btn { height: 32px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg);
  font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--bg2); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--ink); color: var(--onink); border-color: var(--ink); }
.btn.primary:hover:not(:disabled) { background: var(--ink); opacity: .9; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--danger); }
.btn.block { width: 100%; height: 38px; }
.icon { width: 30px; height: 30px; padding: 0; border: 0; border-radius: 7px; background: transparent; color: var(--muted);
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.icon:hover { background: var(--bg2); color: var(--text); }
input.field, select.field, textarea.field { width: 100%; height: 34px; border: 1px solid var(--border); border-radius: 7px;
  background: var(--bg); padding: 0 10px; outline: none; }
textarea.field { height: 90px; padding: 8px 10px; resize: vertical; font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace; }
.field:focus { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
.label { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 6px; display: block; }
.muted { color: var(--muted); }
.small { font-size: 11px; }
.card { border: 1px solid var(--border); border-radius: 10px; background: var(--bg); }
.row { display: flex; align-items: center; gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 99px;
  background: var(--bg3); color: var(--muted); font-size: 10.5px; font-weight: 500; white-space: nowrap; }
.pill.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.notice { padding: 9px 11px; border-radius: 8px; background: var(--bg2); color: var(--muted); font-size: 11.5px; }
.notice.warn { background: var(--warn-bg); color: var(--warn); }
.notice.error { background: color-mix(in srgb, var(--danger) 10%, var(--bg)); color: var(--danger); }
.hint { border: 1px dashed var(--border); border-radius: 10px; padding: 14px; display: flex; gap: 12px; align-items: center; }
.hint .ico { width: 32px; height: 32px; border-radius: 8px; background: var(--bg2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.sep { height: 1px; background: var(--border); }
.hidden { display: none !important; }

/* ---------- panel ---------- */
.view { position: absolute; inset: 0; display: flex; flex-direction: column; }
.top { height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 12px; border-bottom: 1px solid var(--border); }
.top select { flex: 1; min-width: 0; height: 34px; border: 0; background: transparent; font-size: 14px; font-weight: 600; padding: 0 4px; border-radius: 7px; }
.top select:hover { background: var(--bg2); }
.scroll { flex: 1; min-height: 0; overflow: auto; padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 18px; }
.sel-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 12px; }
.sel-row .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grow { flex: 1; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.item { display: flex; align-items: center; gap: 8px; padding: 7px 4px 7px 10px; border-radius: 8px; }
.item:hover { background: var(--bg2); }
.item .open { flex: 1; min-width: 0; text-align: left; border: 0; background: transparent; padding: 0; }
.item .nm { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .mt { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.foot { height: 40px; flex-shrink: 0; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; font-size: 11px; color: var(--muted); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.steps { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }

/* ---------- wall ---------- */
.wallbar { height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-bottom: 1px solid var(--border); background: var(--bg); position: relative; z-index: 3; }
.wallbar .title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wallbar .status { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.zoomval { width: 48px; text-align: center; font-size: 11px; color: var(--muted); border: 0; background: transparent; }
#banner { position: absolute; left: 12px; right: 12px; top: 58px; z-index: 4; }
body.walling, body.walling * { user-select: none; -webkit-user-select: none; }
body.walling input, body.walling textarea { user-select: text; -webkit-user-select: text; }
/* The wall's canvas has its own colours, so it can be light or dark whatever Figma's theme is (View options). */
#viewport { --cv-bg: var(--bg2); --cv-ink: var(--text); --cv-sub: var(--muted); --cv-line: color-mix(in srgb, var(--cv-ink) 16%, transparent);
  flex: 1; min-height: 0; position: relative; overflow: hidden; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  color: var(--cv-ink); background-color: var(--cv-bg); background-image: radial-gradient(color-mix(in srgb, var(--cv-ink) 14%, transparent) 1px, transparent 1px); background-size: 20px 20px; }
#viewport[data-bg="light"] { --cv-bg: #f0f0f0; --cv-ink: #1e1e1e; --cv-sub: #6b6b6b; }
#viewport[data-bg="gray"] { --cv-bg: #9e9e9e; --cv-ink: #111111; --cv-sub: #2e2e2e; }
#viewport[data-bg="dark"] { --cv-bg: #1e1e1e; --cv-ink: #f2f2f2; --cv-sub: #a3a3a3; }
#viewport[data-bg="black"] { --cv-bg: #000000; --cv-ink: #ffffff; --cv-sub: #9a9a9a; }
#viewport.no-grid { background-image: none; }
#viewport[data-frame="none"] .fr { box-shadow: none; }
#viewport[data-frame="shadow"] .fr { box-shadow: 0 calc(2px * var(--inv)) calc(6px * var(--inv)) rgba(0,0,0,.12), 0 calc(10px * var(--inv)) calc(30px * var(--inv)) rgba(0,0,0,.16); }
#viewport.no-names .lbl, #viewport.no-headings .ch, #viewport.no-edges .edge, #viewport.no-meta .lbl .mt { display: none; }
#viewport.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
/* No background: frames with rounded corners or see-through areas show the canvas, like in Figma. */
.fr { position: absolute; box-shadow: 0 0 0 calc(1px * var(--inv)) var(--cv-line); }
.fr img, .fr .sk, .fr .ph { border-radius: inherit; }
.fr.sel { outline: calc(2px * var(--inv)) solid var(--brand); outline-offset: calc(2px * var(--inv)); }
.fr img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; pointer-events: none; }
.fr img { position: relative; z-index: 1; transition: opacity .3s ease; }
.fr img.ld { opacity: 0; }
/* Loading skeleton: a soft sweep plus a small spinner and what's happening, kept screen-sized at any zoom. */
.fr .sk { position: absolute; inset: 0; overflow: hidden; background: color-mix(in srgb, var(--cv-ink) 7%, var(--cv-bg)); display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(8px * var(--inv)); color: var(--cv-sub); font-size: calc(12px * var(--inv)); text-align: center; }
.fr .sk::before { content: ''; position: absolute; inset: 0; transform: translateX(-100%); animation: sk-sweep 1.6s ease-in-out infinite;
  background: linear-gradient(100deg, transparent 20%, color-mix(in srgb, var(--text) 7%, transparent) 50%, transparent 80%); }
.fr .sk .spin { width: calc(18px * var(--inv)); height: calc(18px * var(--inv)); border-radius: 50%; animation: sk-spin .8s linear infinite;
  border: calc(2px * var(--inv)) solid color-mix(in srgb, var(--text) 16%, transparent); border-top-color: var(--brand); }
.fr .sk .tx { position: relative; }
@keyframes sk-sweep { to { transform: translateX(100%); } }
@keyframes sk-spin { to { transform: rotate(360deg); } }
.far .fr .sk .tx { display: none; }
@media (prefers-reduced-motion: reduce) { .fr .sk::before, .fr .sk .spin { animation: none; } .fr img { transition: none; } }
.fr .ph { position: absolute; inset: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px;
  background: repeating-linear-gradient(45deg, var(--bg2) 0 12px, var(--bg3) 12px 24px); color: var(--muted);
  font-size: calc(12px * var(--inv)); }
.fr.missing .ph { color: var(--danger); }
.lbl { position: absolute; left: 0; bottom: 100%; transform-origin: 0 100%; transform: scale(var(--inv)); padding-bottom: 6px;
  width: max-content; max-width: max(24px, calc(var(--w) * var(--z) * 1px)); pointer-events: none; }
.lbl .nm { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lbl .upd { margin-right: 5px; vertical-align: 1px; }
.lbl .mt { font-size: 10.5px; color: var(--cv-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.upd { background: var(--brand); color: var(--onbrand); font-size: 9.5px; font-weight: 600; padding: 1px 6px; border-radius: 99px; }
.ch { position: absolute; right: 100%; transform-origin: 100% 0; transform: scale(var(--inv)); padding-right: 24px; text-align: right;
  font-size: 15px; font-weight: 700; white-space: nowrap; }
.ch em { display: block; font-style: normal; font-size: 11px; color: var(--cv-sub); font-weight: 500; }
.far .lbl .mt { display: none; }
.fr .edge { position: absolute; pointer-events: none; outline: calc(1px * var(--inv)) dashed color-mix(in srgb, var(--brand) 70%, transparent); }
.ch { pointer-events: auto; cursor: pointer; }
.ch:hover { color: var(--brand); }
.hist-preview { margin-top: 10px; border-radius: 8px; background: var(--bg2); min-height: 140px; height: 42vh; padding: 8px; display: flex; align-items: center; justify-content: center; }
.hist-preview img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; box-shadow: 0 0 0 1px color-mix(in srgb, var(--text) 12%, transparent); }
.hist-empty { padding: 24px 16px; text-align: center; align-self: center; }
.hist-seg { display: inline-grid; grid-template-columns: auto auto; gap: 2px; padding: 2px; border-radius: 7px; background: var(--bg2); }
.hist-seg button { height: 24px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; font-size: 11px; color: var(--muted); }
.hist-seg button.on { background: var(--bg); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.hist-list { max-height: 30vh; overflow: auto; margin: 0 -4px; }
.hist-row { width: 100%; display: flex; text-align: left; gap: 8px; padding: 7px 8px; border: 0; border-radius: 7px; background: transparent; }
.hist-row:hover { background: var(--bg2); }
.hist-row.on { background: color-mix(in srgb, var(--brand) 14%, transparent); }
.hist-row .nm { display: block; font-weight: 500; }
.hist-row .mt { display: block; font-size: 10.5px; color: var(--muted); }
#history { position: absolute; right: 12px; top: 60px; bottom: 12px; width: 340px; z-index: 5; padding: 12px; overflow: auto; box-shadow: 0 8px 28px rgba(0,0,0,.18); }
#world.glide { transition: transform .35s cubic-bezier(.2,.7,.2,1); }
@media (prefers-reduced-motion: reduce) { #world.glide { transition: none; } }
.fr { cursor: default; }
.fr.dim { opacity: .12; }
.fr.dragging { z-index: 5; opacity: .85; pointer-events: none; box-shadow: 0 calc(12px * var(--inv)) calc(40px * var(--inv)) rgba(0,0,0,.3); }
.drop-line { position: absolute; z-index: 4; width: calc(4px * var(--inv)); margin-left: calc(-2px * var(--inv)); border-radius: 99px; background: var(--brand); pointer-events: none; }
#viewport.spacepan, #viewport.spacepan .fr { cursor: grab; }
#viewport.panning, #viewport.panning .fr, #viewport.arranging, #viewport.arranging .fr { cursor: grabbing; }
.badge-dot { position: absolute; top: 3px; right: 3px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 99px; background: var(--brand); color: var(--onbrand); font-size: 9px; font-weight: 700; line-height: 14px; text-align: center; }
.icon { position: relative; }
#filters { position: absolute; right: 12px; top: 56px; width: 280px; max-height: calc(100% - 80px); overflow: auto; z-index: 6; padding: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.18); display: flex; flex-direction: column; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { height: 26px; padding: 0 10px; border-radius: 99px; border: 1px solid var(--border); background: transparent; color: var(--text); font: inherit; font-size: 11.5px; cursor: pointer; }
.chips button em { font-style: normal; color: var(--muted); margin-left: 4px; }
.chips button.on { background: var(--brand); border-color: var(--brand); color: var(--onbrand); }
.chips button.on em { color: inherit; opacity: .8; }
#filterpill { position: absolute; left: 12px; top: 12px; z-index: 3; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 6px 0 12px; border-radius: 99px;
  background: var(--bg); color: var(--text); font-size: 11.5px; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
#filterpill button { height: 22px; border: 0; border-radius: 99px; padding: 0 8px; background: var(--bg2); color: var(--text); font: inherit; font-size: 11px; cursor: pointer; }
#shortcuts { position: absolute; right: 12px; top: 56px; width: 280px; z-index: 7; padding: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.18); font-size: 12px; }
#shortcuts .row { justify-content: space-between; padding: 3px 0; }
kbd { font: inherit; font-size: 10.5px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg2); color: var(--text); white-space: nowrap; }
/* Present mode: no chrome, the current frame in focus, the rest dimmed. */
body.presenting .wallbar, body.presenting #inspector, body.presenting #history, body.presenting #viewopts, body.presenting #filters,
body.presenting #shortcuts, body.presenting #filterpill, body.presenting #grip, body.presenting .lbl, body.presenting .ch { display: none !important; }
body.presenting #viewport { background-image: none; cursor: default; }
body.presenting .fr:not(.cur) { opacity: .08; }
body.presenting .fr { box-shadow: none; }
#hud { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 8; display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 12px;
  background: rgba(20,20,20,.86); color: #fff; font-size: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.35); transition: opacity .3s; max-width: calc(100% - 32px); }
#hud.idle { opacity: 0; }
#hud button { height: 30px; min-width: 30px; border: 0; border-radius: 8px; background: transparent; color: #fff; font: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; }
#hud button:hover { background: rgba(255,255,255,.14); }
#hud .what { padding: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#hud .what em { font-style: normal; opacity: .6; margin-left: 6px; }
/* Review statuses */
.st { display: inline-flex; align-items: center; gap: 4px; height: 16px; padding: 0 6px; border-radius: 99px; font-size: 9.5px; font-weight: 600; vertical-align: 1px; margin-right: 5px; white-space: nowrap; }
.st::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-draft { background: color-mix(in srgb, #8a8a8a 20%, transparent); color: #8a8a8a; }
.st-review { background: color-mix(in srgb, #e5a000 20%, transparent); color: #c98a00; }
.st-approved { background: color-mix(in srgb, #14ae5c 20%, transparent); color: #14ae5c; }
.lbl .st { height: 15px; }
.progress { display: flex; height: 6px; border-radius: 99px; overflow: hidden; background: var(--bg3); gap: 2px; }
.progress span { display: block; height: 100%; transition: width .4s ease; }
.progress .p-approved { background: #14ae5c; } .progress .p-review { background: #e5a000; } .progress .p-draft { background: #a0a0a0; }
.progress-label { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-top: 5px; }
.statusseg { display: flex; gap: 2px; padding: 2px; border-radius: 7px; background: var(--bg2); }
.statusseg button { flex: 1; height: 26px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); font: inherit; font-size: 10.5px; cursor: pointer; white-space: nowrap; padding: 0 4px; }
.statusseg button.on { background: var(--bg); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.statusseg button.on.s-approved { color: #14ae5c; } .statusseg button.on.s-review { color: #c98a00; }
/* Campaign home */
.brand { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; padding-left: 2px; }
.brand .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); color: var(--onink); display: flex; align-items: center; justify-content: center; }
.home-search { position: relative; }
.home-search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.home-search input { padding-left: 32px; }
.ccard { display: block; flex-shrink: 0; width: 100%; text-align: left; padding: 0; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); color: var(--text); font: inherit; cursor: pointer; overflow: hidden;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; position: relative; }
.ccard:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,0,0,.12); border-color: color-mix(in srgb, var(--text) 18%, transparent); }
.ccard.active { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
.ccard .collage { height: 128px; display: grid; gap: 2px; background: var(--bg2); }
.ccard .collage.n1 { grid-template-columns: 1fr; } .ccard .collage.n2 { grid-template-columns: 1fr 1fr; }
.ccard .collage.n3 { grid-template-columns: 1.4fr 1fr; grid-template-rows: 1fr 1fr; } .ccard .collage.n3 .t:first-child { grid-row: span 2; }
.ccard .collage.n4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.ccard .collage .t { background: var(--bg3) center top / cover no-repeat; min-height: 0; }
.ccard .collage.empty { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px; gap: 6px; }
.ccard .body { padding: 11px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.ccard .name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ccard .meta { font-size: 11px; color: var(--muted); }
.ccard .wallbtn { position: absolute; top: 8px; right: 8px; height: 26px; padding: 0 9px; border: 0; border-radius: 99px; background: rgba(20,20,20,.72); color: #fff; font: inherit; font-size: 11px;
  display: flex; align-items: center; gap: 5px; opacity: 0; transition: opacity .15s; cursor: pointer; }
.ccard:hover .wallbtn, .ccard:focus-within .wallbtn { opacity: 1; }
.avatars { display: flex; }
.avatars span { width: 22px; height: 22px; border-radius: 50%; color: #fff; font-size: 8px; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg); margin-left: -5px; flex-shrink: 0; }
.avatars span:first-child { margin-left: 0; }
/* Motion: frames glide to new spots, new frames arrive with a glow, popovers and views ease in. */
.fr { transition: opacity .25s ease; }
.fr.flip { transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .25s ease; }
.fr.arrive { --ad: 0ms; animation: fr-in .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--ad); }
.fr.arrive::after { content: ''; position: absolute; inset: calc(-6px * var(--inv)); border-radius: inherit; pointer-events: none;
  border: calc(3px * var(--inv)) solid var(--brand); box-shadow: 0 0 calc(28px * var(--inv)) color-mix(in srgb, var(--brand) 55%, transparent);
  animation: fr-glow 4s ease-out both; animation-delay: var(--ad); }
@keyframes fr-in { from { opacity: 0; transform: scale(.94); } }
@keyframes fr-glow { 0% { opacity: 0; } 12% { opacity: 1; } 70% { opacity: .8; } 100% { opacity: 0; } }
#arrivals { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 4; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; max-width: calc(100% - 24px); }
.arrival { pointer-events: auto; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 6px 0 8px; border-radius: 99px; background: var(--bg); color: var(--text);

<body>
<div id="app"></div>
<div id="toast" class="hidden" role="status"></div>
<script>
'use strict'
// ---------------------------------------------------------------------------
// Showroom UI. Talks to code.js via postMessage and to Figma's REST API via fetch.
// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------
// TEAM SETUP: the Figma folders (projects) where your team keeps channel files.
// The plugin searches these for campaign frames, so everyone sees the same campaigns.
// Get an ID from a folder's link: figma.com/files/…/project/123456789/Email → '123456789'.
// Or set teamId (the number after /team/ in the team's link) and the plugin finds the
// team's folders by itself. Anyone can also add a team or folders for themselves in Settings.
// ---------------------------------------------------------------------------
const TEAM = {
  teamId: '',        // optional, e.g. '1234567890123456789'
  folders: [
    // { id: '123456789', name: 'Email' },
  ],
  lookBackDays: 30,  // default for Settings › Look back: new files are only searched if edited this recently
  indexFile: '',     // optional Team sync file key (Enterprise): figma.com/design/<this part>/Showroom-Index
}

const API_HOST = 'https://api.figma.com'
const PANEL = { width: 360, height: 640 }
const IMAGE_MAX_AGE = 20 * 24 * 3600 * 1000   // render URLs from the API expire; re-render after 20 days
const S = {
  view: 'loading', data: null, token: '', cache: { files: {} }, scan: { files: {} }, prefs: {}, selection: { items: [], skipped: 0, total: 0 },
  file: { key: '', name: '', keyFromApi: false, manifest: { campaigns: {} } }, channelChoice: 'auto', creating: false,
  search: { busy: false, status: '', error: '' }, history: null, ob: { checks: null, busy: false, error: '' },
  index: { files: {}, vars: {}, colId: '', modeId: '', readAt: 0, error: '', writeError: '', canWrite: null, pauseUntil: 0 },
  wall: { zoom: 1, tx: 40, ty: 80, selected: [], busy: false, status: '', banner: null, fitted: false,
    phase: {}, tried: {}, retried: {}, loaded: {}, pending: false, synced: false,
    filter: { campaignId: '', channels: [], people: [], updated: false }, present: null },
}

// ---------- plumbing ----------
function send(type, data) { parent.postMessage({ pluginMessage: Object.assign({ type: type }, data || {}) }, '*') }
function $(id) { return document.getElementById(id) }
function esc(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) }
let toastTimer = null
function toast(text, isError) {
  const el = $('toast'); el.textContent = text; el.className = isError ? 'error' : ''
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.add('hidden'), isError ? 6000 : 2800)
}
function ago(ts) {
  if (!ts) return ''
  const t = typeof ts === 'string' ? Date.parse(ts) : ts
  const s = Math.max(0, (Date.now() - t) / 1000)
  if (s < 60) return 'just now'
  if (s < 3600) return Math.round(s / 60) + ' min ago'
  if (s < 86400) return Math.round(s / 3600) + ' h ago'
  if (s < 86400 * 14) return Math.round(s / 86400) + ' d ago'
  return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
}
function hashStr(str) {
  let h = 2166136261
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) }
  return (h >>> 0).toString(36) + '-' + str.length.toString(36)
}
function icon(name, size) {
  const s = size || 16
  const paths = {
    gear: '<path d="M2.5 5h6.5M12 5h1.5M2.5 11h2M7.5 11h6"/><circle cx="10.5" cy="5" r="1.5"/><circle cx="6" cy="11" r="1.5"/>',
    plus: '<path d="M8 3.5v9M3.5 8h9"/>', x: '<path d="M4 4l8 8M12 4l-8 8"/>', left: '<path d="M9.5 4.5L6 8l3.5 3.5"/>',
    wall: '<rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M2.5 6.5h11M7 6.5v7"/>',
    refresh: '<path d="M13 8a5 5 0 1 1-1.46-3.54M13.2 2.8v2.9h-2.9"/>', ext: '<path d="M9.5 2.5h4v4M13.5 2.5L7.5 8.5M11.5 9.5v4h-9v-9h4"/>',
    pointer: '<path d="M3.5 2.5l9 4-4 1.5-1.5 4z"/>', fit: '<path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/>',
    minus: '<path d="M3.5 8h9"/>', check: '<path d="M3.5 8.5l3 3 6-6.5"/>',
    clock: '<circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.2l2 1.3"/>',
    grid: '<rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/>',
    search: '<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l3 3"/>',
    filter: '<path d="M2.5 3.5h11L9.3 8.6v3.9l-2.6 1.2V8.6z"/>', play: '<path d="M5 3.3v9.4L12.5 8z"/>', right: '<path d="M6.5 4.5L10 8l-3.5 3.5"/>',
    keys: '<rect x="1.5" y="4" width="13" height="8" rx="1.5"/><path d="M4 6.5h.01M6.5 6.5h.01M9 6.5h.01M11.5 6.5h.01M5 9.5h6"/>',
  }
  return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths[name] + '</svg>'
}
// ---------- campaigns: what the team has (file manifests) + your drafts ----------
// A campaign's frames come from the manifests stored inside each design file: this file's
// (read live) plus every file the folder search found. This computer only adds drafts
// (campaigns with no frames yet) and personal things like hidden frames.
function manifests() {
  const out = []
  for (const key of Object.keys(S.scan.files || {})) {
    const f = S.scan.files[key]
    if (key !== S.file.key && f && f.manifest) out.push({ key: key, fileName: f.manifest.fileName || f.name, m: f.manifest })
  }
  if (S.file.key && S.file.manifest) out.push({ key: S.file.key, fileName: S.file.name, m: S.file.manifest })
  return out
}

function allCampaigns() {
  const map = {}
  const hiddenItems = (S.data && S.data.hiddenItems) || {}
  const seen = (S.data && S.data.seen) || {}
  const get = (id) => map[id] || (map[id] = { id: id, name: '', nameAt: -1, items: [], shared: false })
  for (const src of manifests()) {
    for (const cid of Object.keys(src.m.campaigns || {})) {
      const mc = src.m.campaigns[cid]
      const c = get(cid)
      c.shared = true
      if ((mc.updatedAt || 0) > c.nameAt) { c.name = mc.name || c.name; c.nameAt = mc.updatedAt || 0 }
      for (const nodeId of Object.keys(mc.items || {})) {
        const it = mc.items[nodeId]
        c.items.push({ id: src.key + '|' + nodeId, fileKey: src.key, fileName: src.fileName, nodeId: nodeId, name: it.name,
          width: it.w, height: it.h, pageName: it.pageName, channel: it.channel || 'Other', addedBy: it.addedBy,
          addedAt: it.addedAt || 0, updatedAt: it.updatedAt || it.addedAt || 0, shared: true })
      }
    }
  }
  for (const lc of (S.data ? S.data.campaigns : [])) {
    const c = get(lc.id)
    const localAt = lc.renamedAt || (c.nameAt < 0 ? lc.createdAt || 0 : -1)
    if (!c.name || localAt > c.nameAt) { c.name = lc.name; c.nameAt = Math.max(c.nameAt, localAt) }
  }
  const hidden = (S.data && S.data.hidden) || []
  return Object.keys(map).map((id) => map[id]).filter((c) => hidden.indexOf(c.id) < 0).map((c) => {
    const skip = hiddenItems[c.id] || []
    c.hiddenCount = c.items.filter((it) => skip.indexOf(it.id) >= 0).length
    c.items = c.items.filter((it) => skip.indexOf(it.id) < 0)
    c.items.forEach((it) => { it.seenHash = seen[it.id] || '' })
    const sm = statusMap(c.id)
    c.items.forEach((it) => { const st = sm[it.id]; it.status = st ? st.s || '' : ''; it.statusBy = st ? st.by || '' : ''; it.statusAt = st ? st.at || 0 : 0 })
    return c
  }).sort((a, b) => a.name.localeCompare(b.name))
}

function campaign() {
  if (!S.data) return null
  const list = allCampaigns()
  return list.find((c) => c.id === S.data.activeCampaignId) || list[0] || null
}
function nodeInfo(item) {
  const f = S.cache.files[item.fileKey]
  return f && f.nodes ? f.nodes[item.nodeId] : null
}
function isUpdated(item) {
  const n = nodeInfo(item)
  return !!(n && n.hash && item.seenHash && n.hash !== item.seenHash)
}

// ---------- Figma REST API ----------
class ApiError extends Error {}

// Figma's heaviest requests (reading a file, rendering images) are limited per minute.
// Space them out so we never hit the limit; if Figma still says "slow down", wait a minute.
const tier1Log = []
async function tier1Gate() {
  for (;;) {
    const now = Date.now()
    while (tier1Log.length && now - tier1Log[0] > 60000) tier1Log.shift()
    if (tier1Log.length < (window.CW_TIER1_PER_MIN || 12)) { tier1Log.push(now); return }
    const wait = Math.ceil((60000 - (now - tier1Log[0])) / 1000)
    if (S.view === 'wall' && S.wall.busy) { S.wall.status = 'Pausing for Figma’s rate limit (' + wait + ' s)…'; renderWallBar() }
    await new Promise((r) => setTimeout(r, 60000 - (now - tier1Log[0]) + 50))
  }
}
function isTier1(path) { return /^\/v1\/images\//.test(path) || /^\/v1\/files\/[^/]+(\/nodes)?(\?|$)/.test(path) }

// opts.method + opts.body send a JSON request (only used to write Team sync variables).
async function api(path, opts) {
  if (path.indexOf('https://') === 0) path = path.replace(API_HOST, '')
  if (!/^\/v\d\//.test(path)) path = '/v1' + path
  const write = !!(opts && opts.method)
  if (!write && isTier1(path)) await tier1Gate()
  let res
  try {
    res = await fetch(API_HOST + path, write
      ? { method: opts.method, headers: { 'X-Figma-Token': S.token, 'Content-Type': 'application/json' }, body: JSON.stringify(opts.body) }
      : { headers: { 'X-Figma-Token': S.token } })
  } catch (e) {
    const err = new ApiError('Couldn’t reach Figma’s API from the plugin (' + (e && e.message ? e.message : 'network error') + ').')
    err.kind = 'network'; throw err
  }
  if (res.status === 429) {
    const wait = res.headers.get('Retry-After')
    const err = new ApiError('Figma’s rate limit was reached' + (wait ? '. Try again in ' + wait + ' s.' : '. Try again in a minute.'))
    err.kind = 'rate'; throw err
  }
  if (!res.ok) {
    let detail = ''
    try { const body = await res.json(); detail = body.err || body.message || '' } catch (e) {}
    const err = new ApiError(detail || ('HTTP ' + res.status))
    // 401 here means the token is missing a scope, which is the same as "not allowed".
    err.kind = res.status === 403 || res.status === 401 ? 'forbidden' : res.status === 404 ? 'notfound' : 'http'
    err.status = res.status; throw err
  }
  return res.json()
}

async function testToken(token) {
  const saved = S.token
  S.token = token
  try {
    const me = await api('/me')
    return me
  } finally { S.token = saved }
}

// ---------- finding the team's campaigns ----------
// Three ways a file with campaign frames gets found, cheapest first:
//  1. Links: every campaign file's manifest lists the other campaign files its editors knew
//     about. Linked files get a cheap "has it changed?" check and are only read if it has.
//  2. Folders: the team's folders (set up by hand, or found from the team's ID) are listed,
//     and files are read the first time they're seen (if edited within Look back) or after
//     they've been edited. Files without campaign frames are re-read at most once a day.
//  3. This file: the manifest of the file the plugin is open in is always read live.
const DAY = 86400000
const SEARCH_STALE = 5 * 60000      // search again on open if the last search is older than this

function lookBackDays() { return Number(S.prefs.lookBackDays) || TEAM.lookBackDays || 30 }
function teamInfo() {
  if (S.prefs.team && S.prefs.team.id) return { id: S.prefs.team.id, name: S.prefs.team.name || '', builtIn: false }
  return TEAM.teamId ? { id: String(TEAM.teamId), name: '', builtIn: true } : null
}
function hasCampaigns(m) { return !!(m && m.campaigns && Object.keys(m.campaigns).length) }
// Campaign frames or a saved frame order: either is worth sharing through Team sync.
function hasShared(m) { return hasCampaigns(m) || !!(m && ((m.layouts && Object.keys(m.layouts).length) || (m.statuses && Object.keys(m.statuses).length))) }

// Folders to search: the built-in ones, your own, and any found from the team's ID.
function teamFolders() {
  const seen = {}
  const team = teamInfo()
  const found = team && S.scan.team && S.scan.team.id === team.id ? S.scan.team.folders || [] : []
  return TEAM.folders.map((f) => Object.assign({ builtIn: true }, f))
    .concat((S.prefs.folders || []).map((f) => Object.assign({ builtIn: false }, f)))
    .concat(found.map((f) => Object.assign({ fromTeam: true }, f)))
    .filter((f) => f.id && !seen[f.id] && (seen[f.id] = true))
}

// Files known to hold campaign frames, plus files that other files' manifests link to,
// unless this computer has read that file since the link was written and found nothing.
function campaignFiles() {
  const files = S.scan.files || {}
  const out = {}
  for (const key of Object.keys(files)) {
    const f = files[key]
    if (hasCampaigns(f.manifest)) out[key] = f.manifest.fileName || f.name || ''
  }
  for (const src of manifests()) {
    const links = src.m.links || {}
    for (const key of Object.keys(links)) {
      if (key in out) continue
      const f = files[key]
      const disproved = f && f.scannedAt && !f.manifest && (!f.error || f.gone) && f.scannedAt > (src.m.updatedAt || 0)
      if (!disproved) out[key] = links[key] || (f && f.name) || ''
    }
  }
  delete out[S.file.key]
  return out
}
function canSearch() { return !!(teamFolders().length || teamInfo() || indexInfo() || Object.keys(campaignFiles()).length) }

// Keep this file's manifest pointing at every campaign file we know of, so anyone who opens
// the plugin here (or reads this file during a search) can go straight to the others.
// code.js only writes when the list of files actually changes.
function syncLinks() {
  const m = S.file.manifest
  if (!S.file.key || !hasCampaigns(m) || S.search.busy) return
  const want = campaignFiles()
  const wantKeys = Object.keys(want).sort().join(',')
  if (wantKeys === Object.keys(m.links || {}).sort().join(',') || S.linksSent === wantKeys) return
  S.linksSent = wantKeys
  send('save-links', { links: want })
}

// Record this file's own manifest in the search results, so other files learn about it.
function rememberThisFile() {
  if (!S.file.key || !S.scan.files) return
  const m = S.file.manifest
  const prev = S.scan.files[S.file.key]
  if (!hasShared(m) && !(prev && prev.manifest)) return
  if (prev && prev.manifest && m && (prev.manifest.updatedAt || 0) === (m.updatedAt || 0)) return
  S.scan.files[S.file.key] = Object.assign({}, prev || {}, { name: S.file.name, manifest: hasShared(m) ? m : null, scannedAt: Date.now(), error: '' })
  if (!S.search.busy) { S.scan.savedAt = Date.now(); send('save-scan', { scan: S.scan }) }
}

function parseFolderLink(text) {
  const t = String(text || '').trim()
  const m = t.match(/\/(?:project|folder)s?\/(\d+)(?:\/([^/?#]+))?/) || t.match(/^(\d{5,})$/)
  if (!m) return null
  let name = ''
  try { name = m[2] ? decodeURIComponent(m[2]).replace(/[-_]+/g, ' ').trim() : '' } catch (e) {}
  return { id: m[1], name: name || 'Folder ' + m[1] }
}
function parseTeamLink(text) {
  const t = String(text || '').trim()
  const m = t.match(/\/team\/(\d+)(?:\/([^/?#]+))?/) || t.match(/^(\d{5,})$/)
  if (!m) return null
  let name = ''
  try { name = m[2] ? decodeURIComponent(m[2]).replace(/[-_]+/g, ' ').trim() : '' } catch (e) {}
  return { id: m[1], name: name || 'Team ' + m[1] }
}

// Reads every page of a list endpoint.
async function listAll(path, pick) {
  const out = []
  for (let guard = 0; path && guard < 20; guard++) {
    const res = await api(path)
    out.push.apply(out, pick(res))
    path = (res.pagination && res.pagination.next_page) || res.next_page || ''
  }
  return out
}
const retryable = (e) => e.kind === 'network' || e.kind === 'rate'
const notAvailable = (e) => e.status === 400 || e.status === 401 || e.status === 403 || e.status === 404
// Links don't always include a name, so a folder or team can start out as "Folder 123" until Figma tells us its name.
const placeholderName = (name) => !name || /^(Folder|Team) \d+$/.test(name)
function folderName(f) {
  if (!placeholderName(f.name)) return f.name
  const fromTeam = ((S.scan.team && S.scan.team.folders) || []).find((t) => t.id === f.id)
  if (fromTeam && !placeholderName(fromTeam.name)) return fromTeam.name
  const st = (S.scan.folders || {})[f.id]
  return st && !placeholderName(st.name) ? st.name : f.name
}
// Figma's folder access (folders:read) doesn't include the team's name, so unless the pasted
// link had one, it's just "Your team".
function teamName(team) {
  const ts = S.scan.team
  return !placeholderName(team.name) ? team.name : ts && ts.id === team.id && ts.name ? ts.name : 'Your team'
}

// Lists a folder's files (and notes the folder's name if Figma includes it).
// Figma is moving folders to a v2 endpoint; fall back to the v1 one.
async function listFolder(folder) {
  let name = ''
  const pick = (res) => {
    name = name || res.name || (res.folder && res.folder.name) || ''
    return (res.files || res.data || []).filter((f) => f && f.key)
      .map((f) => ({ key: f.key, name: f.name || '', lastModified: f.last_modified || f.lastModified || f.updated_at || '' }))
  }
  let files
  try { files = await listAll('/v2/folders/' + folder.id + '/files', pick) } catch (e) {
    if (!notAvailable(e)) throw e
    files = await listAll('/v1/projects/' + folder.id + '/files', pick)
  }
  files.folderName = name
  return files
}

// Lists a team's folders, including subfolders up to three levels down. Falls back to v1 "projects".
async function listTeamFolders(teamId) {
  let teamName = ''
  const pick = (res) => {
    teamName = teamName || res.team_name || (res.team && res.team.name) || (res.projects ? res.name : '') || ''
    return (res.folders || res.data || res.projects || []).filter((f) => f && f.id)
      .map((f) => ({ id: String(f.id), name: f.name || 'Folder ' + f.id }))
  }
  let level
  try { level = await listAll('/v2/teams/' + teamId + '/folders', pick) } catch (e) {
    if (!notAvailable(e)) throw e
    const v1 = await listAll('/v1/teams/' + teamId + '/projects', pick)
    v1.teamName = teamName
    return v1
  }
  const out = []
  out.teamName = teamName
  for (let depth = 0; level.length && depth < 3 && out.length < 300; depth++) {
    out.push.apply(out, level)
    const next = []
    for (const f of level) {
      try { next.push.apply(next, await listAll('/v2/folders/' + f.id + '/folders', pick)) } catch (e) { if (retryable(e)) throw e }
    }
    level = next
  }
  return out
}

function readManifestFromDocument(doc) {
  const parse = (node) => {
    try {
      const raw = node && node.sharedPluginData && node.sharedPluginData.showroom && node.sharedPluginData.showroom.manifest
      const m = raw ? JSON.parse(raw) : null
      return m && m.campaigns ? m : null
    } catch (e) { return null }
  }
  let best = parse(doc)
  for (const page of (doc && doc.children) || []) {
    const m = parse(page)
    if (m && (!best || (m.updatedAt || 0) > (best.updatedAt || 0))) best = m
  }
  return best
}

// When a file was last touched, from Figma's cheap metadata call (or the wall's recent check).
async function lastTouched(key, manual) {
  const fc = S.cache.files[key]
  if (!manual && fc && fc.lastTouchedAt && Date.now() - (fc.checkedAt || 0) < SEARCH_STALE) return fc.lastTouchedAt
  const meta = (await api('/files/' + key + '/meta')).file || {}
  return meta.last_touched_at || ''
}

// opts.manual: the refresh button. Lists every folder and re-reads every edited file.
async function discover(opts) {
  opts = opts || {}
  if (!S.token || S.search.busy || !canSearch()) return
  S.search.busy = true; S.search.error = ''
  const scan = S.scan
  scan.files = scan.files || {}
  scan.folders = scan.folders || {}
  const now = Date.now()
  const since = now - lookBackDays() * DAY
  const status = (text) => { S.search.status = text; renderSearchStatus() }
  const queue = {}     // files to read, by key
  const listed = {}    // files seen in a folder listing this time
  const checked = {}   // linked files already checked this time
  const add = (f, linked) => { if (f.key !== S.file.key && !queue[f.key]) queue[f.key] = Object.assign({ linked: !!linked }, f) }
  try {
    // 1. The team's folders, if a team is set up. Re-listed once a day.
    const team = teamInfo()
    if (team && (opts.manual || !scan.team || scan.team.id !== team.id || now - (scan.team.checkedAt || 0) > DAY)) {
      status('Finding the team’s folders…')
      const keep = scan.team && scan.team.id === team.id ? scan.team.folders || [] : []
      try {
        const found = await listTeamFolders(team.id)
        scan.team = { id: team.id, name: found.teamName || '', checkedAt: now, folders: found.slice(), error: '' }
      } catch (e) {
        if (retryable(e)) throw e
        scan.team = { id: team.id, checkedAt: now, folders: keep, error: e.kind === 'forbidden' ? 'Your token can’t list this team’s folders. It needs folders:read access.' : e.message }
      }
    }

    // 2. Folders. Listing a folder is a light request, so each one is listed every search.
    // (Figma's per-folder "has it changed?" check needs a token scope personal tokens don't offer.)
    const folders = teamFolders()
    for (let i = 0; i < folders.length; i++) {
      status('Checking folder ' + (i + 1) + ' of ' + folders.length + '…')
      const folder = folders[i]
      const shownName = folderName(folder)
      try {
        const files = await listFolder(folder)
        scan.folders[folder.id] = { name: files.folderName || shownName, checkedAt: now, listedAt: now, count: files.length, error: '' }
        for (const f of files) {
          if (f.key === S.file.key) continue
          listed[f.key] = true
          const known = scan.files[f.key]
          if (!known) { if ((Date.parse(f.lastModified) || 0) >= since || opts.everything) add(f); continue }
          // Known only from Team sync: trust it, and just note when the file was last edited.
          if (!known.lastModified && known.indexAt && !opts.manual) { known.lastModified = f.lastModified; continue }
          if (known.lastModified === f.lastModified) continue
          // Edited since we last read it. Campaign files are read now; others at most once a day.
          if (hasCampaigns(known.manifest) || opts.manual || now - (known.scannedAt || 0) > DAY) add(f, hasCampaigns(known.manifest))
        }
      } catch (e) {
        scan.folders[folder.id] = { name: shownName, checkedAt: now, error: e.kind === 'forbidden' ? 'Your token can’t list this folder. It needs folders:read access.' : e.message }
        if (retryable(e)) throw e
      }
    }

    // 3. Linked files, then read everything queued. Newly read files may link to more files.
    let done = 0
    for (let round = 0; round < 4; round++) {
      const links = campaignFiles()
      // With Team sync working, files it already covers don't need checking one by one.
      const toCheck = Object.keys(links).filter((key) => !listed[key] && !queue[key] && !checked[key] && !(indexHealthy() && S.index.files[key] && !opts.manual))
      for (let i = 0; i < toCheck.length; i++) {
        const key = toCheck[i]
        checked[key] = true
        const known = scan.files[key]
        if (!known || !known.scannedAt) { add({ key: key, name: links[key] }, true); continue }
        status('Checking linked files ' + (i + 1) + ' of ' + toCheck.length + '…')
        try {
          const touched = await lastTouched(key, opts.manual)
          if (touched && touched !== known.touched) add({ key: key, name: known.name, lastModified: known.lastModified, touched: touched }, true)
        } catch (e) {
          if (retryable(e)) throw e
          if (e.kind === 'notfound') Object.assign(known, { manifest: null, gone: true, error: 'File not found', scannedAt: now })
        }
      }
      const todo = Object.keys(queue).map((k) => queue[k]).filter((f) => !f.read)
      if (!todo.length) break
      // Campaign files first, then the most recently edited.
      todo.sort((a, b) => (b.linked - a.linked) || ((Date.parse(b.lastModified) || 0) - (Date.parse(a.lastModified) || 0)))
      for (const f of todo) {
        f.read = true
        done += 1
        status('Searching files ' + done + ' of ' + Object.keys(queue).length + '…')
        const prev = scan.files[f.key] || {}
        let touched = f.touched || ''
        try {
          if (!touched) touched = await lastTouched(f.key, true).catch((e) => { if (retryable(e)) throw e; return '' })
          const res = await api('/v1/files/' + f.key + '?depth=1&plugin_data=shared')
          scan.files[f.key] = { name: res.name || f.name || prev.name || '', lastModified: f.lastModified || prev.lastModified || '', touched: touched, scannedAt: Date.now(), manifest: readManifestFromDocument(res.document) }
        } catch (e) {
          if (retryable(e)) throw e
          scan.files[f.key] = { name: f.name || prev.name || '', lastModified: f.lastModified || prev.lastModified || '', scannedAt: Date.now(), touched: touched, manifest: null, error: e.message, gone: e.kind === 'notfound' }
        }
        if (done % 5 === 0) { scan.savedAt = Date.now(); send('save-scan', { scan: scan }); rerenderData() }
      }
    }
    scan.checkedAt = Date.now()
    S.search.status = ''
  } catch (e) {
    S.search.error = e.message
    S.search.status = ''
  } finally {
    S.search.busy = false
    scan.savedAt = Date.now()
    send('save-scan', { scan: scan })
    // Settings shows per-folder results, so redraw it too (unless someone is typing there).
    if (S.view === 'setup' && !(document.activeElement && document.activeElement.tagName === 'INPUT')) renderSetup()
    else rerenderData()
  }
  if (!S.search.error) { syncLinks(); healIndex() }
}

function campaignFileCount() {
  const n = Object.keys(campaignFiles()).filter((k) => S.scan.files && S.scan.files[k] && hasCampaigns(S.scan.files[k].manifest)).length
  return n + (hasCampaigns(S.file.manifest) ? 1 : 0)
}
function searchSummary() {
  if (!canSearch()) return 'No team folders set up yet'
  if (S.search.busy) return S.search.status || 'Searching…'
  if (S.search.error) return 'Search stopped: ' + S.search.error
  const folders = teamFolders().length
  const found = campaignFileCount()
  if (indexInfo() && !S.index.error) return (S.index.readAt ? 'Team sync on · updated ' + ago(S.index.readAt) : 'Team sync starting…') + ' · ' + found + ' file' + (found === 1 ? '' : 's') + ' with campaign frames'
  return 'Searched ' + (folders ? folders + ' folder' + (folders === 1 ? '' : 's') : 'linked files') + (S.scan.checkedAt ? ' ' + ago(S.scan.checkedAt) : '') + ' · ' + found + ' file' + (found === 1 ? '' : 's') + ' with campaign frames'
}
function renderSearchStatus() {
  const el = $('search-status'); if (el) el.textContent = searchSummary()
}
function rerenderData() {
  if (S.view === 'wall') renderWall()
  else if (S.view === 'panel' || S.view === 'home') render()
  else renderSearchStatus()
}
// With Team sync working, changes arrive through it, so the full search can run less often.
function searchIsStale() { return !S.scan.checkedAt || Date.now() - S.scan.checkedAt > (indexHealthy() ? 30 * 60000 : SEARCH_STALE) }

// ---------- Team sync: a shared index kept in one Figma file's variables (Enterprise) ----------
// Every campaign file's manifest is copied into a hidden variable collection in one shared
// "Showroom Index" file: one text variable per design file, named "f/<fileKey>", holding that
// file's manifest as JSON. One read of that file returns every campaign file at once, so it's
// checked every 45 seconds while the plugin is open.
// The manifests inside the design files stay the source of truth. The index is a fast copy:
// this window copies its own file's manifest in whenever it changes, and anything newer that
// a normal search finds is copied in too, so the index repairs itself.
const INDEX_COLLECTION = 'Showroom index'
const INDEX_POLL = 45000
let indexQueue = Promise.resolve()
let indexPublishTimer = null

function indexInfo() {
  if (S.prefs.index && S.prefs.index.key) return { key: S.prefs.index.key, name: S.prefs.index.name || '', builtIn: false }
  return TEAM.indexFile ? { key: String(TEAM.indexFile), name: '', builtIn: true } : null
}
function indexHealthy() { return !!(indexInfo() && S.index.readAt && !S.index.error && Date.now() - S.index.readAt < 5 * 60000) }
function parseFileLink(text) {
  const t = String(text || '').trim()
  const m = t.match(/figma\.com\/(?:design|file)\/([A-Za-z0-9]{10,})(?:\/([^/?#]+))?/) || t.match(/^([A-Za-z0-9]{10,})$/)
  if (!m) return null
  let name = ''
  try { name = m[2] ? decodeURIComponent(m[2]).replace(/[-_]+/g, ' ').trim() : '' } catch (e) {}
  return { key: m[1], name: name || 'Index file' }
}
// Index reads and writes run one at a time.
function indexTask(fn) { const run = indexQueue.then(fn, fn); indexQueue = run.catch(() => {}); return run }

async function readIndex() {
  const info = indexInfo()
  const res = await api('/v1/files/' + info.key + '/variables/local')
  const meta = res.meta || {}
  const cols = Object.values(meta.variableCollections || {}).filter((c) => c && c.name === INDEX_COLLECTION && !c.remote)
  const modeOf = (col) => col.defaultModeId || (col.modes && col.modes[0] && col.modes[0].modeId) || ''
  const files = {}, vars = {}
  for (const v of Object.values(meta.variables || {})) {
    const col = v && cols.find((c) => c.id === v.variableCollectionId)
    if (!col || !/^f\//.test(v.name || '')) continue
    const values = v.valuesByMode || {}
    const raw = values[modeOf(col)] != null ? values[modeOf(col)] : values[Object.keys(values)[0]]
    let m = null
    try { m = JSON.parse(raw) } catch (e) {}
    if (!m || !m.campaigns || typeof m.campaigns !== 'object') continue
    const key = v.name.slice(2)
    // Two people could create the collection at the same moment; keep the newest entry.
    if (!files[key] || (m.updatedAt || 0) > (files[key].updatedAt || 0)) { files[key] = m; vars[key] = { id: v.id, modeId: modeOf(col) } }
  }
  S.index.files = files
  S.index.vars = vars
  S.index.colId = cols[0] ? cols[0].id : ''
  S.index.modeId = cols[0] ? modeOf(cols[0]) : ''
  S.index.readAt = Date.now()
  S.index.error = ''
}

// Copies newer index entries into the search results, which everything else reads from.
function mergeIndex() {
  const files = S.scan.files = S.scan.files || {}
  let changed = false
  for (const key of Object.keys(S.index.files)) {
    if (key === S.file.key) continue
    const m = S.index.files[key]
    const prev = files[key]
    if (prev && prev.manifest && (prev.manifest.updatedAt || 0) >= (m.updatedAt || 0)) continue
    // This computer read the file after that entry was written and found no campaign frames.
    if (prev && !prev.manifest && (prev.scannedAt || 0) > (m.updatedAt || 0)) continue
    files[key] = Object.assign({}, prev || {}, { name: m.fileName || (prev && prev.name) || '', manifest: m, indexAt: Date.now(), error: '', gone: false })
    changed = true
  }
  return changed
}

function indexValue(m) { const copy = Object.assign({}, m); delete copy.links; return JSON.stringify(copy) }

// Writes several files' manifests to the index in one request.
async function writeIndex(list) {
  const info = indexInfo()
  if (!info || !S.token || S.index.canWrite === false || !list.length) return
  const body = { variables: [], variableModeValues: [] }
  let colId = S.index.colId, modeId = S.index.modeId
  if (!colId) {
    colId = 'col_new'; modeId = 'mode_new'
    body.variableCollections = [{ action: 'CREATE', id: colId, name: INDEX_COLLECTION, initialModeId: modeId, hiddenFromPublishing: true }]
  }
  list = list.slice(0, 100)
  for (const it of list) {
    const existing = S.index.vars[it.key]
    if (existing) { body.variableModeValues.push({ variableId: existing.id, modeId: existing.modeId, value: indexValue(it.manifest) }); continue }
    const tmp = 'v_' + it.key
    body.variables.push({ action: 'CREATE', id: tmp, name: 'f/' + it.key, variableCollectionId: colId, resolvedType: 'STRING', hiddenFromPublishing: true })
    body.variableModeValues.push({ variableId: tmp, modeId: modeId, value: indexValue(it.manifest) })
  }
  if (!body.variables.length) delete body.variables
  try {
    const res = await api('/v1/files/' + info.key + '/variables', { method: 'POST', body: body })
    const ids = (res && res.meta && res.meta.tempIdToRealId) || {}
    if (body.variableCollections) { S.index.colId = ids[colId] || ''; S.index.modeId = ids[modeId] || '' }
    for (const it of list) {
      if (!S.index.vars[it.key] && ids['v_' + it.key]) S.index.vars[it.key] = { id: ids['v_' + it.key], modeId: S.index.modeId }
      S.index.files[it.key] = JSON.parse(indexValue(it.manifest))
    }
    S.index.canWrite = true
    S.index.writeError = ''
  } catch (e) {
    if (e.kind === 'forbidden') S.index.canWrite = false
    else S.index.writeError = e.message
    // Our idea of the index may be out of date (e.g. someone deleted the collection): re-read next time.
    if (!retryable(e)) S.index.readAt = 0
  }
}

// What this window should copy into the index: this file's manifest if it changed, and any
// file a search found with a newer manifest than the index has.
function indexChanges() {
  const out = []
  const ix = S.index.files
  const m = S.file.manifest
  if (S.file.key && m && (hasShared(m) || ix[S.file.key]) && (!ix[S.file.key] || (m.updatedAt || 0) > (ix[S.file.key].updatedAt || 0))) out.push({ key: S.file.key, manifest: m })
  const files = S.scan.files || {}
  for (const key of Object.keys(files)) {
    if (key === S.file.key) continue
    const f = files[key], entry = ix[key]
    if (f.gone && entry && hasShared(entry)) { out.push({ key: key, manifest: { v: 1, fileKey: key, fileName: entry.fileName, updatedAt: Date.now(), campaigns: {} } }); continue }
    if (!f.manifest) continue
    if (entry ? (f.manifest.updatedAt || 0) > (entry.updatedAt || 0) : hasShared(f.manifest)) out.push({ key: key, manifest: f.manifest })
  }
  return out
}
function healIndex() {
  if (!indexInfo() || !S.token || S.index.canWrite === false || !S.index.readAt) return
  return indexTask(async () => {
    if (!S.index.readAt) return
    const list = indexChanges()
    if (list.length) { await writeIndex(list); renderSearchStatus() }
  })
}
// After this file's campaign list changes, copy it in (a moment later, so quick edits batch up).
function queueIndexPublish() {
  if (!indexInfo() || !S.index.readAt) return
  clearTimeout(indexPublishTimer)
  indexPublishTimer = setTimeout(() => healIndex(), 1200)
}

// Reads the index, folds in what changed and copies back anything newer. Runs every 45 s.
async function pollIndex() {
  if (!indexInfo() || !S.token || Date.now() < (S.index.pauseUntil || 0)) return
  return indexTask(async () => {
    const before = (campaign() || { items: [] }).items.map((it) => it.id).join(',')
    try { await readIndex() } catch (e) {
      S.index.error = e.kind === 'forbidden' ? 'Your token can’t read the index file’s variables. It needs File variables access, an Enterprise plan and a Full seat.'
        : e.kind === 'notfound' ? 'Index file not found. Check the link in Settings.' : e.message
      if (e.kind === 'rate') S.index.pauseUntil = Date.now() + 120000
      renderSearchStatus()
      return
    }
    const changed = mergeIndex()
    const list = indexChanges()
    if (list.length) await writeIndex(list)
    if (changed) { S.scan.savedAt = Date.now(); send('save-scan', { scan: S.scan }) }
    if (!changed) { if (S.view === 'setup') renderSetupIfIdle(); else renderSearchStatus(); return }
    const after = (campaign() || { items: [] }).items.map((it) => it.id).join(',')
    if (S.view === 'wall') renderWall()   // renderWall loads any frames it hasn't seen yet
    else if (S.view === 'setup') renderSetupIfIdle()
    else rerenderData()
  })
}
function renderSetupIfIdle() {
  if (S.view === 'setup' && !(document.activeElement && document.activeElement.tagName === 'INPUT')) renderSetup()
  else renderSearchStatus()
}

// ---------- version history ----------
async function loadVersions(fileKey, more) {
  const h = S.history
  const url = more && h.next ? h.next : '/v1/files/' + fileKey + '/versions?page_size=30'
  h.loading = true; renderHistory()
  try {
    const res = await api(url)
    h.versions = (more ? h.versions : []).concat((res.versions || []).map((v) => ({
      id: v.id, at: v.created_at, label: v.label || '', description: v.description || '', user: v.user ? v.user.handle : '' })))
    h.next = res.pagination && res.pagination.next_page ? res.pagination.next_page : ''
    h.error = ''
  } catch (e) {
    h.error = e.kind === 'forbidden' ? 'Your token needs File versions (read) access to show history. Make a new token with it in Settings.' : e.message
  }
  h.loading = false; renderHistory()
}

async function showVersion(versionId) {
  const h = S.history
  h.pick = versionId; h.view = 'then'
  const key = h.item.nodeId + '@' + versionId
  const cached = h.renders[key]
  if (!cached || Date.now() - cached.at > IMAGE_MAX_AGE) {
    h.rendering = true; renderHistory()
    try {
      const w = Math.max(1, (nodeInfo(h.item) || {}).viewW || h.item.width || 1000)
      const scale = w > 1600 ? 0.5 : 1
      const res = await api('/v1/images/' + h.item.fileKey + '?ids=' + encodeURIComponent(h.item.nodeId) + '&format=png&scale=' + scale + '&version=' + encodeURIComponent(versionId))
      const url = res.images ? res.images[h.item.nodeId] : null
      h.renders[key] = { url: url || '', at: Date.now(), missing: !url }
    } catch (e) {
      h.renders[key] = { url: '', at: Date.now(), error: e.message }
    }
    h.rendering = false
  }

// Three kinds of check, all built on syncItems():
//  'auto'     (opening the wall): 1 light metadata call per file; frames are re-read only if Figma
//             reports the file changed (new version or new last-saved time).
//  'manual'   (refresh button): also re-reads every file's frames, because Figma's version marker can
//             lag behind recent edits. Only frames whose contents changed are re-rendered.
//  'selected' (refresh on selected frames): re-reads every campaign frame in the same files (same
//             cost) and always re-renders the picked frames.
async function refreshWall(mode) {
  const c = campaign()
  if (!c) return
  return syncItems(c.items, { readFrames: mode === 'manual' ? 'always' : 'if-changed', forceRender: [], fullFile: true })
}

async function refreshSelected() {
  const c = campaign()
  if (!c) return
  // Figma's limits count requests, not frames, so re-reading every campaign frame in the same files
  // costs nothing extra. Only the frames you picked are force re-rendered; others only if they changed.
  const picked = c.items.filter((it) => S.wall.selected.indexOf(it.id) >= 0)
  const files = new Set(picked.map((it) => it.fileKey))
  const inFiles = c.items.filter((it) => files.has(it.fileKey))
  if (picked.length) return syncItems(inFiles, { readFrames: 'always', forceRender: picked.map((it) => it.nodeId), fullFile: true })
}

function frameGeometry(doc) {
  const bb = doc.absoluteBoundingBox || doc.absoluteRenderBounds || {}
  const rb = doc.absoluteRenderBounds || bb

  // non-clipping frame, so the tile is sized to the render bounds, not the frame's own box.
  return {
    width: Math.round(bb.width || 0), height: Math.round(bb.height || 0),
    viewW: Math.round(rb.width || bb.width || 0), viewH: Math.round(rb.height || bb.height || 0),
    offX: Math.round((bb.x || 0) - (rb.x || bb.x || 0)), offY: Math.round((bb.y || 0) - (rb.y || bb.y || 0)),

  if (Array.isArray(r) && r.length === 4 && r.some((x) => x > 0)) return r.map((x) => Math.round(x) + 'px').join(' ')
  return doc.cornerRadius > 0 ? Math.round(doc.cornerRadius) + 'px' : ''
}

async function syncItems(list, opts) {
  const c = campaign()
  if (!c) return
  // Already loading: note it, and pick up anything still missing as soon as this round ends.
  if (S.wall.busy) { S.wall.pending = true; return }
  if (!S.token) { S.wall.banner = { kind: 'warn', text: 'Add your Figma token in Settings to load previews.' }; renderWall(); return }
  S.wall.busy = true; S.wall.banner = null
  const byFile = {}
  for (const item of list) (byFile[item.fileKey] = byFile[item.fileKey] || []).push(item)
  const keys = Object.keys(byFile)
  for (const key of keys) setPhase(key, byFile[key].map((it) => it.nodeId), 'queued')
  let problems = 0
  for (let i = 0; i < keys.length; i++) {
    const key = keys[i]
    const items = byFile[key]
    S.wall.status = 'Checking file ' + (i + 1) + ' of ' + keys.length + '…'
    renderWallBar()
    const fc = S.cache.files[key] || { nodes: {} }
    try {
      const meta = (await api('/files/' + key + '/meta')).file || {}
      fc.name = meta.name || fc.name
      fc.lastTouchedAt = meta.last_touched_at || fc.lastTouchedAt
      fc.lastTouchedBy = meta.last_touched_by ? (meta.last_touched_by.handle || '') : (fc.lastTouchedBy || '')
      fc.checkedAt = Date.now()
      fc.error = ''
      const ids = items.map((it) => it.nodeId)
      const stamp = String(meta.version || '') + '|' + String(meta.last_touched_at || '')
      const read = opts.readFrames === 'always' || fc.stamp !== stamp || ids.some((id) => !fc.nodes[id] || !fc.nodes[id].viewW)
      if (read) {
        setPhase(key, ids, 'reading')
        S.wall.status = 'Reading ' + (ids.length === 1 ? 'frame' : ids.length + ' frames') + ' in “' + (fc.name || 'file') + '”…'; renderWallBar()
        const res = await api('/files/' + key + '/nodes?ids=' + encodeURIComponent(ids.join(',')))
        for (const id of ids) {
          const entry = res.nodes ? res.nodes[id] : null
          const prev = fc.nodes[id] || {}
          if (!entry || !entry.document) { fc.nodes[id] = Object.assign({}, prev, { missing: true, url: '', urlAt: 0 }); continue }
          const doc = entry.document
          const hash = hashStr(JSON.stringify(doc))
          const same = prev.hash === hash
          fc.nodes[id] = Object.assign({ name: doc.name, hash: hash }, frameGeometry(doc), {
            url: same ? prev.url : '', urlAt: same ? prev.urlAt : 0,
            changedAt: prev.hash && !same ? (Date.parse(fc.lastTouchedAt) || Date.now()) : (prev.changedAt || 0),
          })
        }
        fc.version = meta.version
        // Only a read of every campaign frame in the file makes the file “known current”.
        if (opts.fullFile) fc.stamp = stamp
      }
      const toRender = ids.filter((id) => {
        const n = fc.nodes[id]
        if (!n || n.missing) return false
        return opts.forceRender.indexOf(id) >= 0 || !n.url || Date.now() - (n.urlAt || 0) > IMAGE_MAX_AGE
      })
      if (toRender.length) {
        setPhase(key, toRender, 'rendering')
        S.wall.status = 'Rendering ' + toRender.length + ' frame' + (toRender.length === 1 ? '' : 's') + '…'; renderWallBar()
        await renderImages(key, toRender, fc, 1)
        const failed = toRender.filter((id) => !fc.nodes[id].url || fc.nodes[id].renderFailed)
        if (failed.length) await renderImages(key, failed, fc, 0.5)   // very large frames can fail at 1x
      }
    } catch (e) {
      problems += 1
      fc.error = e.message
      if (e.kind === 'network' || e.kind === 'rate') {
        S.cache.files[key] = fc
        S.wall.banner = { kind: 'error', text: e.message }
        break
      }
      if (e.kind === 'forbidden') fc.error = 'Your token can’t read this file. Check it has File content and File metadata access, and that you can open the file.'
      if (e.kind === 'notfound') fc.error = 'File not found, or you don’t have access to it.'
    }
    S.cache.files[key] = fc
    for (const it of items) delete S.wall.phase[it.id]
    renderWall()
  }
  S.wall.busy = false
  S.wall.synced = true
  S.wall.phase = {}
  S.wall.status = problems ? problems + ' file' + (problems === 1 ? '' : 's') + ' had problems' : 'Checked ' + ago(Date.now())
  S.wall.checkedAt = Date.now()
  S.cache.savedAt = Date.now()
  send('save-cache', { cache: S.cache })
  // First time a frame is seen, remember its version so later edits show as “Updated”.
  const seen = {}
  for (const item of c.items) { const n = nodeInfo(item); if (n && n.hash && !item.seenHash) seen[item.id] = n.hash }
  if (Object.keys(seen).length) send('mark-seen', { campaignId: c.id, seen: seen })
  renderWall()
  if (S.wall.pending) { S.wall.pending = false; setTimeout(loadMissing, 0) }
}

// ---------- moving around: zoom to frames, arrow keys, shortcuts ----------
// Frames in reading order (row by row, as laid out), skipping ones the filter hides.
function orderedPlacements() {
  const out = []

  return out
}

}

  const world = $('world'); if (!world || reducedMotion()) return
  world.classList.add('glide')

  S.wall.glideTimer = setTimeout(() => world.classList.remove('glide'), 400)
}
// Zooms so a box (in wall units) fills the view, never past maxZoom.
function zoomToRect(x, y, w, h, opts) {
  const vp = $('viewport'); if (!vp || !w || !h) return
  opts = opts || {}

  const bottom = opts.bottom || 0
  const z = Math.max(0.02, Math.min(opts.maxZoom || 1, (vp.clientWidth - pad * 2) / w, (vp.clientHeight - pad * 2 - bottom) / h))
  S.wall.zoom = z

  applyTransform()
}
function zoomToSelection() {

  const x1 = Math.min.apply(null, ps.map((p) => p.x)), y1 = Math.min.apply(null, ps.map((p) => p.y))
  const x2 = Math.max.apply(null, ps.map((p) => p.x + p.w)), y2 = Math.max.apply(null, ps.map((p) => p.y + p.h))
  zoomToRect(x1, y1, x2 - x1, y2 - y1, { maxZoom: 2 })

// Brings a frame into view: pans if it fits at this zoom, otherwise zooms out to fit it.
function reveal(p) {
  const vp = $('viewport'); if (!vp || !p) return
  const z = S.wall.zoom, m = 40
  const sx = p.x * z + S.wall.tx, sy = p.y * z + S.wall.ty, sw = p.w * z, sh = p.h * z
  if (sx >= m && sy >= m && sx + sw <= vp.clientWidth - m && sy + sh <= vp.clientHeight - m) return
  if (sw <= vp.clientWidth - m * 2 && sh <= vp.clientHeight - m * 2) {
    S.wall.tx = Math.round((vp.clientWidth - sw) / 2 - p.x * z); S.wall.ty = Math.round((vp.clientHeight - sh) / 2 - p.y * z)
    S.wall.touched = true; glide(); applyTransform()
  } else zoomToRect(p.x, p.y, p.w, p.h, { maxZoom: z })
}
// Arrow keys: ← → previous/next frame; ↑ ↓ the nearest frame in the row above/below.
function stepSelection(dir) {
  const list = orderedPlacements(); if (!list.length) return
  const cur = placementOf(S.wall.selected[S.wall.selected.length - 1])
  let next
  if (!cur || !matchesFilter(cur.it)) next = list[0]
  else if (dir === 'left' || dir === 'right') {
    const i = list.indexOf(list.find((p) => p.it.id === cur.it.id))
    next = list[Math.max(0, Math.min(list.length - 1, i + (dir === 'right' ? 1 : -1)))]
  } else {
    const rows = Array.from(new Set(list.map((p) => p.y))).sort((a, b) => a - b)
    const r = rows.indexOf(cur.y) + (dir === 'down' ? 1 : -1)
    if (r < 0 || r >= rows.length) return
    const mid = cur.x + cur.w / 2
    next = list.filter((p) => p.y === rows[r]).sort((a, b) => Math.abs(a.x + a.w / 2 - mid) - Math.abs(b.x + b.w / 2 - mid))[0]
  }

  setSelection([next.it.id])
  reveal(next)
}
// Returns true if the key was handled.
function wallKey(e) {
  const k = e.key, code = e.code
  if (S.wall.present) {
    if (k === 'Escape') { stopPresent(); return true }
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === ' ' || k === 'PageDown' || k === 'Enter') { presentStep(1); return true }
    if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace') { presentStep(-1); return true }
    if (k === 'Home') { presentGo(0); return true }
    if (k === 'End') { presentGo(S.wall.present.list.length - 1); return true }
    return false
  }
  const open = (id) => $(id) && !$(id).classList.contains('hidden')
  if (k === 'Escape') {
    if (open('shortcuts')) { toggleShortcuts(false); return true }

  }
  if ((e.metaKey || e.ctrlKey) && k.toLowerCase() === 'a') { setSelection(orderedPlacements().map((p) => p.it.id)); return true }
  if (e.metaKey || e.ctrlKey || e.altKey) return false

  if (e.shiftKey && code === 'Digit0') { const vp = $('viewport'); glide(); zoomAt(1 / S.wall.zoom, vp.clientWidth / 2, vp.clientHeight / 2); return true }
  if (k === '+' || k === '=') { const vp = $('viewport'); zoomAt(1.25, vp.clientWidth / 2, vp.clientHeight / 2); return true }
  if (k === '-' || k === '_') { const vp = $('viewport'); zoomAt(0.8, vp.clientWidth / 2, vp.clientHeight / 2); return true }
