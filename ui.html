// ---------- arranging: drag frames within their row (order shared with the team) ----------
// The order is a list of frame IDs per campaign. It's saved in this file's manifest ("layouts"),
// so it reaches everyone like campaign lists do, plus a local copy in case this file can't be edited.
function campaignOrder(campaignId) {
  let best = (S.prefs.layouts || {})[campaignId] || null
  for (const src of manifests()) {
    const l = src.m.layouts && src.m.layouts[campaignId]
    if (l && Array.isArray(l.order) && (!best || (l.at || 0) > (best.at || 0))) best = l
  }
  return best ? best.order : []
}
function orderItems(c) {
  const order = campaignOrder(c.id)
  if (!order.length) return c.items.slice()
  const rank = {}
  order.forEach((id, i) => { rank[id] = i })
  return c.items.map((it, i) => ({ it: it, r: it.id in rank ? rank[it.id] : order.length + i })).sort((a, b) => a.r - b.r).map((x) => x.it)
}
function startArrange(d) {
  const p = placementOf(d.target.dataset.id)
  const g = (S.wall.bounds.groups || []).find((grp) => grp.items.indexOf(p) >= 0)
  if (!p || !g) { d.arrange = false; return }
  d.place = p; d.group = g
  d.el = d.target
  d.el.classList.add('dragging')
  $('viewport').classList.add('arranging')
  d.line = document.createElement('div'); d.line.className = 'drop-line'; $('world').appendChild(d.line)
  if (S.wall.selected.indexOf(p.it.id) < 0) setSelection([p.it.id])
}
function arrangeSlot(d, e) {
  const vp = $('viewport'); const r = vp.getBoundingClientRect(); const z = S.wall.zoom
  const wx = (e.clientX - r.left - S.wall.tx) / z, wy = (e.clientY - r.top - S.wall.ty) / z
  const others = d.group.items.filter((q) => q !== d.place)
  const rowH = {}
  others.forEach((q) => { rowH[q.y] = Math.max(rowH[q.y] || 0, q.h) })
  const after = (q) => wy >= q.y + rowH[q.y] ? true : wy < q.y ? false : wx > q.x + q.w / 2
  const index = others.filter(after).length

}
function moveArrange(d, e) {
  const z = S.wall.zoom
  d.el.style.transform = 'translate(' + ((e.clientX - d.x) / z) + 'px,' + ((e.clientY - d.y) / z) + 'px)'
  const slot = arrangeSlot(d, e)
  const ref = slot.others[slot.index] || slot.others[slot.others.length - 1]
  if (!ref) { d.line.style.display = 'none'; return }
  const before = !!slot.others[slot.index]
  const gap = (SPACING[wallView().spacing] || SPACING.normal)[0]
  d.line.style.cssText = 'display:block;left:' + (before ? ref.x - gap / 2 : ref.x + ref.w + gap / 2) + 'px;top:' + ref.y + 'px;height:' + ref.h + 'px'
}

  const ids = slot.others.map((q) => q.it.id)
  ids.splice(slot.index, 0, d.place.it.id)
  const before = d.group.items.map((q) => q.it.id)
  if (ids.join('|') === before.join('|')) return
  // Let the dropped frame glide from where it was let go, not from its old slot.
  const z = S.wall.zoom
  if (S.wall.lastPos) S.wall.lastPos[d.place.it.id] = { x: d.place.x + (e.clientX - d.x) / z, y: d.place.y + (e.clientY - d.y) / z }

  const groupIds = {}
  before.forEach((id) => { groupIds[id] = true })
  const full = []
  let placed = false
  for (const g of S.wall.bounds.groups) for (const q of g.items) {
    if (groupIds[q.it.id]) { if (!placed) { full.push.apply(full, ids); placed = true } } else full.push(q.it.id)
  }
  saveOrder(full)
}
function saveOrder(order) {
  const c = campaign(); if (!c) return
  const entry = { order: order, at: Date.now(), by: (S.prefs.me && S.prefs.me.handle) || '' }
  S.prefs.layouts = Object.assign({}, S.prefs.layouts || {}, { [c.id]: entry })
  send('save-prefs', { prefs: { layouts: S.prefs.layouts } })
  send('save-layout', { campaignId: c.id, layout: entry })

// ---------- live: frames arriving, activity ----------
// Glides frames that moved since the last draw to their new spot, and greets frames that are new
// since the wall opened (a teammate's, or yours from another file) with a glow and a notice.
function animateWall(L, c) {
  const now = Date.now()
  const pos = {}
  for (const g of L.groups) for (const p of g.items) pos[p.it.id] = { x: p.x, y: p.y }
  const prev = S.wall.lastPos
  const known = S.wall.known
  const fresh = known ? c.items.filter((it) => !known[it.id]) : []
  fresh.forEach((it) => { S.wall.arriving[it.id] = now })
  const motion = !reducedMotion() && !S.wall.present
  const D = 450
  S.wall.flights = S.wall.flights || {}
  for (const id of Object.keys(pos)) {
    const el = document.querySelector('.fr[data-id="' + cssEsc(id) + '"]'); if (!el) continue
    const since = S.wall.arriving[id]
    if (since && now - since < 4000) { el.classList.add('arrive'); el.style.setProperty('--ad', -(now - since) + 'ms') }
    else if (since) delete S.wall.arriving[id]
    const was = prev && prev[id]
    // A frame that moved starts a glide; a glide still under way when the wall redraws (e.g. right
    // after saving) carries on from where it had got to instead of snapping.
    let dx = 0, dy = 0, dur = D
    const f = S.wall.flights[id]
    const p = f ? Math.min(1, (now - f.t0) / D) : 1
    const left = f && p < 1 ? Math.pow(1 - p, 3) : 0   // how much of the glide is left (ease-out curve)
    if (motion && was && (Math.abs(was.x - pos[id].x) > 0.5 || Math.abs(was.y - pos[id].y) > 0.5)) {
      dx = was.x - pos[id].x + (f ? f.dx * left : 0); dy = was.y - pos[id].y + (f ? f.dy * left : 0)
      S.wall.flights[id] = { dx: dx, dy: dy, t0: now }
    } else if (motion && f && p < 1) {
      dx = f.dx * left; dy = f.dy * left; dur = Math.max(80, D * (1 - p))
    } else { delete S.wall.flights[id]; continue }
    el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)'
    el.getBoundingClientRect()   // commit the starting point before animating back to 0
    el.style.transitionDuration = dur + 'ms'
    el.classList.add('flip'); el.style.transform = ''
    setTimeout(() => { el.classList.remove('flip'); el.style.transitionDuration = '' }, dur + 50)
  }
  S.wall.lastPos = pos
  S.wall.known = {}
  c.items.forEach((it) => { S.wall.known[it.id] = true })
  if (fresh.length) announceArrivals(fresh)
}
function announceArrivals(items) {
  const vp = $('viewport'); if (!vp) return
  let box = $('arrivals')
  if (!box) { box = document.createElement('div'); box.id = 'arrivals'; vp.appendChild(box) }
  const byPerson = {}
  items.forEach((it) => { const who = it.addedBy || 'Someone'; (byPerson[who] = byPerson[who] || []).push(it) })
  for (const who of Object.keys(byPerson)) {
    const list = byPerson[who]
    const name = (nodeInfo(list[0]) || {}).name || list[0].name
    const el = document.createElement('div')
    el.className = 'arrival'
    el.innerHTML = '<div class="avatars">' + avatar(who) + '</div><span class="txt"><b>' + esc(who) + '</b> added ' + (list.length === 1 ? '<b>' + esc(name) + '</b> · ' + esc(list[0].channel) : list.length + ' frames') + '</span><button>Show</button>'
    el.querySelector('button').addEventListener('click', () => { setSelection(list.map((it) => it.id)); zoomToSelection(); dismiss() })
    const dismiss = () => { el.classList.add('out'); setTimeout(() => el.remove(), 400) }

// In the panel and on the home screen: a short note when a teammate's frames arrive.

// ---------- loading states on the wall ----------

}

  const list = c.items.filter((it) => needsImage(it) && !S.wall.tried[it.id])

async function renderImages(key, ids, fc, scale) {
  const res = await api('/images/' + key + '?ids=' + encodeURIComponent(ids.join(',')) + '&format=png&scale=' + scale)
  const images = res.images || {}
  for (const id of ids) {
    if (images[id]) { fc.nodes[id].url = images[id]; fc.nodes[id].urlAt = Date.now(); fc.nodes[id].renderFailed = false }
    else fc.nodes[id].renderFailed = true

}

// ---------- rendering: shell ----------
function render() {
  const app = $('app')

    html += '<select id="campaign" aria-label="Campaign">' + campaigns.map((x) => '<option value="' + esc(x.id) + '"' + (c && x.id === c.id ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('') + '</select>'
    html += '<button class="icon" id="new-campaign" aria-label="New campaign" title="New campaign">' + icon('plus') + '</button>'
  } else html += '<div class="grow" style="font-size:14px;font-weight:600;padding-left:4px">Showroom</div>'
  html += '<button class="icon" id="settings" aria-label="Settings" title="Settings">' + icon('gear') + '</button></div>'
  html += '<div class="scroll">'

  if (!campaigns.length || S.creating) {
    html += '<div class="stack"><div style="font-size:15px;font-weight:600">' + (campaigns.length ? 'New campaign' : 'Start a campaign') + '</div>'
    html += '<div class="muted small">Add frames from any file, in any channel folder, then see them together on one wall. Your team sees the same campaign.</div>'
    html += '<input class="field" id="campaign-name" placeholder="e.g. Holiday 2026" maxlength="80" aria-label="Campaign name">'
    html += '<div class="row"><button class="btn primary grow" id="create">Create campaign</button>' + (campaigns.length ? '<button class="btn" id="cancel-create">Cancel</button>' : '') + '</div>'
    if (!campaigns.length && S.token && canSearch()) html += '<div class="muted small" id="search-status">' + esc(searchSummary()) + '</div>'
    if (!campaigns.length && S.token && !canSearch()) html += '<div class="notice small">Joining your team’s campaigns? Add your team or its folders in Settings so the plugin can find them. Opening the plugin in any file with campaign frames works too.</div>'
    html += '</div></div>' + footer() + '</div>'
    $('app').innerHTML = html
    bindPanel(); setTimeout(() => { const el = $('campaign-name'); if (el) el.focus() }, 0)
    return
  }

  // On a FigJam board: send the campaign to the board, or sync it. In design files: the selection.
  if (S.editor === 'figjam') html += boardCard(c)
  else {
  const sel = S.selection
  html += '<div class="stack"><div class="label" style="margin:0">Selection</div>'
  if (!sel.items.length) {
    html += '<div class="hint"><span class="ico">' + icon('pointer') + '</span><div><div style="font-weight:600">Add frames</div><div class="muted small">Select frames in this file to add them to ' + esc(c.name) + '.</div></div></div>'
    if (sel.skipped) html += '<div class="notice small">' + sel.skipped + ' selected layer' + (sel.skipped === 1 ? ' isn’t a frame' : 's aren’t frames') + '. Select top-level frames, components or sections.</div>'
  } else {
    if (!S.file.key) {
      html += '<div class="notice warn stack"><div><b>One-time step for this file.</b> Figma didn’t give the plugin this file’s ID. Paste its link (Share › Copy link) so the wall can find these frames.</div>'
      html += '<div class="row"><input class="field" id="file-link" placeholder="https://www.figma.com/design/…"><button class="btn" id="save-file-link">Save</button></div></div>'
    }
    const already = sel.items.filter((it) => it.inCampaigns.indexOf(c.id) >= 0).length
    html += '<div class="card">'
    sel.items.slice(0, 4).forEach((it, i) => {
      if (i) html += '<div class="sep"></div>'
      const inThis = it.inCampaigns.indexOf(c.id) >= 0
      html += '<div class="sel-row"><div class="grow"><div class="nm">' + esc(it.name) + '</div><div class="muted small">' + it.width + ' × ' + it.height + ' · ' + esc(S.channelChoice === 'auto' ? it.guess : S.channelChoice) + '</div></div>' + (inThis ? '<span class="pill ok">' + icon('check', 11) + 'In campaign</span>' : '') + '</div>'
    })
    if (sel.items.length > 4) html += '<div class="sep"></div><div class="sel-row muted small">+ ' + (sel.items.length - 4) + ' more</div>'
    html += '</div>'
    html += '<div><label class="label" for="channel">Channel</label><select class="field" id="channel"><option value="auto"' + (S.channelChoice === 'auto' ? ' selected' : '') + '>Auto (guess from size)</option>' + S.data.channels.map((ch) => '<option' + (S.channelChoice === ch ? ' selected' : '') + '>' + esc(ch) + '</option>').join('') + '</select></div>'
    const label = already === sel.items.length
      ? 'Update ' + (sel.items.length === 1 ? 'frame' : sel.items.length + ' frames') + ' in ' + c.name
      : 'Add ' + (sel.items.length === 1 ? 'frame' : sel.items.length + ' frames') + ' to ' + c.name
    html += '<button class="btn primary block" id="add"' + (S.file.key ? '' : ' disabled') + '>' + esc(label) + '</button>'
  }
  html += '</div>'
  }

  // Campaign summary + wall
  const byChannel = {}
  c.items.forEach((it) => { byChannel[it.channel] = (byChannel[it.channel] || 0) + 1 })
  const files = new Set(c.items.map((it) => it.fileKey)).size
  const updated = c.items.filter(isUpdated).length
  const channelOrder = S.data.channels.concat(Object.keys(byChannel).filter((ch) => S.data.channels.indexOf(ch) < 0))
  html += '<div class="card stack" style="padding:14px;gap:10px">'
  html += '<div class="row" style="align-items:baseline"><span style="font-size:22px;font-weight:600;letter-spacing:-0.02em">' + c.items.length + '</span><span class="muted">frame' + (c.items.length === 1 ? '' : 's') + ' from ' + files + ' file' + (files === 1 ? '' : 's') + '</span>' + (updated ? '<span class="pill warn" style="margin-left:auto">' + updated + ' updated</span>' : '') + '</div>'
  if (c.items.length) html += '<div class="chips">' + channelOrder.filter((ch) => byChannel[ch]).map((ch) => '<span class="pill">' + esc(ch) + ' ' + byChannel[ch] + '</span>').join('') + '</div>'
  if (c.items.length) html += progressBar(c.items)
  html += '<button class="btn primary block" id="open-wall"' + (c.items.length ? '' : ' disabled') + '>' + icon('wall') + (S.token ? 'Open wall' : 'Connect Figma to open the wall') + '</button>'
  html += '</div>'

  html += activityFeed(c)

  if (c.hiddenCount) html += '<div class="notice small row" style="gap:8px"><span class="grow">' + c.hiddenCount + ' frame' + (c.hiddenCount === 1 ? ' is' : 's are') + ' hidden on your wall.</span><button class="btn ghost" id="unhide-items" style="height:26px">Show</button></div>'

  // Items
  if (c.items.length) {
    html += '<div><div class="label">Frames in this campaign</div><div>'
    const sorted = c.items.slice().sort((a, b) => channelOrder.indexOf(a.channel) - channelOrder.indexOf(b.channel) || String(a.name).localeCompare(String(b.name)))
    sorted.forEach((it) => {
      const n = nodeInfo(it)
      const name = n && n.name ? n.name : it.name
      const here = it.fileKey === S.file.key
      const where = here ? 'this file' : esc((S.cache.files[it.fileKey] || {}).name || it.fileName)
      html += '<div class="item' + (S.freshIds && S.freshIds[it.id] && Date.now() - S.freshIds[it.id] < 2500 ? ' new' : '') + '"><button class="open" data-open="' + esc(it.id) + '" title="' + (here ? 'Select in this file' : 'Open in its file') + '"><div class="nm">' + statusBadge(it.status) + esc(name) + (isUpdated(it) ? ' <span class="upd">Updated</span>' : '') + '</div><div class="mt">' + esc(it.channel) + ' · ' + where + (it.addedBy ? ' · added by ' + esc(it.addedBy) : '') + '</div></button>'
      html += '<button class="icon" data-remove="' + esc(it.id) + '" aria-label="Remove ' + esc(name) + ' from campaign" title="' + (here ? 'Remove from campaign' : 'Hide on my wall (it lives in another file)') + '">' + icon('x', 14) + '</button></div>'
    })
    html += '</div></div>'
  }
  html += '</div>' + footer() + '</div>'
  $('app').innerHTML = html
  bindPanel()
}

function footer() {
  const me = S.prefs.me
  if (!S.token) return '<div class="foot"><span class="dot" style="background:var(--danger)"></span><span class="grow">Not connected to Figma’s API</span><button class="btn ghost" id="connect" style="height:28px">Connect</button></div>'
  const folders = canSearch()
  return '<div class="foot"><span class="dot" style="background:' + (S.search.error || S.index.error ? 'var(--warn)' : 'var(--ok)') + '"></span><span class="grow" id="search-status" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="' + esc(searchSummary()) + '">' +
    (folders ? esc(searchSummary()) : 'Connected' + (me && me.handle ? ' as ' + esc(me.handle) : '') + ' · no team folders yet') + '</span>' +
    (!folders ? '<button class="btn ghost" id="connect" style="height:28px">Set up</button>'
      : S.search.busy ? '<button class="btn ghost" id="search-stop" style="height:26px;padding:0 8px" title="Stop searching (what it found so far is kept)">Stop</button>'
      : '<button class="icon" id="search-now" title="Search every team folder now (full Look back)" aria-label="Search for team campaigns now">' + icon('refresh', 14) + '</button>') + '</div>'
}

function bindPanel() {
  const on = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn) }
  on('campaign', 'change', (e) => { const c = allCampaigns().find((x) => x.id === e.target.value); send('set-active', { campaignId: e.target.value, campaignName: c ? c.name : '' }) })
  on('new-campaign', 'click', () => { S.creating = true; render() })
  on('cancel-create', 'click', () => { S.creating = false; render() })
  on('create', 'click', () => {
    const name = $('campaign-name').value.trim(); if (!name) return $('campaign-name').focus()
    S.creating = false
    // Someone on the team may already have this campaign: join it instead of making a twin.
    const existing = allCampaigns().find((x) => x.name.trim().toLowerCase() === name.toLowerCase())
    if (existing) { send('set-active', { campaignId: existing.id, campaignName: existing.name }); toast('“' + existing.name + '” already exists, so you’ve joined it.'); return }
    send('create-campaign', { name: name })
  })
  on('campaign-name', 'keydown', (e) => { if (e.key === 'Enter') $('create').click() })
  on('settings', 'click', () => { S.view = 'setup'; render() })
  on('connect', 'click', () => { S.view = 'setup'; render() })
  on('home', 'click', () => { S.view = 'home'; render() })
  on('search-now', 'click', () => discover({ manual: true }))
  on('search-stop', 'click', () => { S.search.stop = true; S.search.status = 'Stopping…'; renderSearchStatus() })
  on('unhide-items', 'click', () => send('unhide-items', { campaignId: campaign().id }))
  on('channel', 'change', (e) => { S.channelChoice = e.target.value; render() })
  on('add', 'click', () => { const c = campaign(); send('add-selection', { campaignId: c.id, campaignName: c.name, channel: S.channelChoice }) })
  on('save-file-link', 'click', () => send('set-file-key', { url: $('file-link').value }))
  on('board-send', 'click', () => sendToBoard('place'))
  on('board-sync', 'click', () => sendToBoard('sync'))
  document.querySelectorAll('[data-bopt]').forEach((el) => el.addEventListener('click', () => {
    S.prefs.boardOpts = Object.assign({}, boardOpts(), { [el.dataset.bopt]: el.dataset.bopt === 'scale' ? Number(el.dataset.val) : el.dataset.val })
    send('save-prefs', { prefs: { boardOpts: S.prefs.boardOpts } }); render()
  }))
  on('open-wall', 'click', () => { if (!S.token) { S.view = 'setup'; render(); return } openWall() })
  document.querySelectorAll('[data-open]').forEach((el) => el.addEventListener('click', () => openItem(el.dataset.open)))
  document.querySelectorAll('[data-remove]').forEach((el) => el.addEventListener('click', () => send('remove-item', { campaignId: campaign().id, itemIds: [el.dataset.remove] })))
}

function openItem(itemId, versionId) {
  const c = campaign(); const it = c && c.items.find((x) => x.id === itemId)
  if (it) send('open-item', { fileKey: it.fileKey, nodeId: it.nodeId, versionId: versionId || '' })
}

// ---------- first-run setup ----------
// Three steps: connect a token (each permission checked separately), find the team, turn on Team sync.
// Steps the team has built in (TEAM.teamId / folders / indexFile) show as already done.
const SCOPE_CHECKS = [
  { key: 'me', scope: 'current_user:read', label: 'Your name' },
  { key: 'meta', scope: 'file_metadata:read', label: 'File info (who edited, when)' },
  { key: 'content', scope: 'file_content:read', label: 'Frames and previews' },
  { key: 'versions', scope: 'file_versions:read', label: 'Version history' },
  { key: 'folders', scope: 'folders:read', label: 'Team folders' },
  { key: 'variables', scope: 'file_variables:read', label: 'Team sync' },
]
async function checkAccess() {
  if (!S.token || S.ob.busy) return
  S.ob.busy = true; S.ob.checks = {}; renderWelcomeIfOpen()
  const run = async (key, path, skipNote) => {
    if (!path) { S.ob.checks[key] = { state: 'skip', note: skipNote }; return }
    try { await api(path); S.ob.checks[key] = { state: 'ok' } } catch (e) {
      S.ob.checks[key] = { state: e.kind === 'network' ? 'skip' : 'fail', note: e.kind === 'forbidden' ? 'Not allowed: tick this scope on a new token.' : e.message }
    }
    renderWelcomeIfOpen()
  }
  const key = S.file.key
  await run('me', '/v1/me')
  await run('meta', key ? '/v1/files/' + key + '/meta' : '', 'Checked once this file has a link')
  await run('content', key ? '/v1/files/' + key + '?depth=1' : '', 'Checked once this file has a link')
  await run('versions', key ? '/v1/files/' + key + '/versions?page_size=1' : '', 'Checked once this file has a link')
  const team = teamInfo()
  const folder = TEAM.folders[0] || (S.prefs.folders || [])[0]
  await run('folders', team ? '/v2/teams/' + team.id + '/folders' : folder ? '/v2/folders/' + folder.id + '/files' : '', 'Checked when you add your team')
  const idx = indexInfo()
  await run('variables', idx ? '/v1/files/' + idx.key + '/variables/local' : '', 'Checked when you turn on Team sync (Enterprise)')
  S.ob.busy = false
  renderWelcomeIfOpen()
}
function renderWelcomeIfOpen() { if (S.view === 'welcome' && !(document.activeElement && document.activeElement.tagName === 'INPUT')) renderWelcome() }
function renderWelcome() {
  const me = S.prefs.me
  const team = teamInfo(), idx = indexInfo()
  const fromIndex = !!(team && team.fromIndex) || !!((indexConfig() || {}).folders || []).length
  const builtInTeam = !!(TEAM.teamId || TEAM.folders.length) || fromIndex
  const step = (n, done, title, tag, desc, body) => '<div class="ob-step' + (done ? ' done' : '') + '"><div class="ob-num">' + (done ? icon('check', 13) : n) + '</div><div class="ob-body">' +
    '<div class="ob-title">' + title + (tag ? '<em>' + tag + '</em>' : '') + '</div>' + (desc ? '<div class="ob-desc">' + desc + '</div>' : '') + (body || '') + '</div></div>'
  let html = '<div class="view"><div class="scroll" style="padding:0"><div class="welcome">'
  html += '<div class="hero"><div class="mark">' + icon('wall', 22) + '</div><h1>Welcome to Showroom</h1><div class="lede">Every frame in a campaign, side by side at real size, live from its own file. Three quick steps and you’re in.</div></div>'

  // 1. Token
  let body1 = ''
  if (!S.token) {
    body1 += '<div class="ob-desc">In Figma, open <b>Settings › Security › Personal access tokens</b> and make a token with: <code>current_user:read</code> <code>file_content:read</code> <code>file_metadata:read</code> <code>file_versions:read</code> <code>folders:read</code>, plus <code>file_variables</code> read and write for Team sync.</div>'
    body1 += '<div class="row"><input class="field" id="ob-token" type="password" placeholder="figd_…" autocomplete="off" aria-label="Personal access token"><button class="btn primary" id="ob-connect">Connect</button></div>'
    if (S.ob.error) body1 += '<div class="notice error small">' + esc(S.ob.error) + '</div>'
  } else {
    body1 += '<div class="scopes">' + SCOPE_CHECKS.map((sc) => {
      const r = S.ob.checks && S.ob.checks[sc.key]
      const state = r ? r.state : 'skip'
      const mark = !r ? (S.ob.busy ? '…' : '–') : state === 'ok' ? '✓' : state === 'fail' ? '✕' : '–'
      return '<div class="sc ' + (r ? state : 'skip') + '"><i>' + mark + '</i><div>' + esc(sc.label) + ' <code>' + sc.scope + '</code>' + (r && r.note ? '<small>' + esc(r.note) + '</small>' : '') + '</div></div>'
    }).join('') + '</div>'
    if (!S.ob.checks && !S.ob.busy) body1 += '<button class="btn" id="ob-check" style="align-self:flex-start;height:28px">Check access</button>'
  }
  html += step(1, !!S.token, 'Connect to Figma', '', S.token ? 'Connected' + (me && me.handle ? ' as <b>' + esc(me.handle) + '</b>' : '') + '. Your token stays on this computer.' : 'Showroom reads frames through Figma’s API with your own token. It stays on this computer.', body1)

  // 2. Team
  let body2 = ''
  const ts = team && S.scan.team && S.scan.team.id === team.id ? S.scan.team : null
  if (builtInTeam) body2 = ''
  else if (team) body2 = ''
  else body2 = '<div class="row"><input class="field" id="ob-team" placeholder="figma.com/files/team/…" aria-label="Team link"><button class="btn" id="ob-team-add"' + (S.token ? '' : ' disabled') + '>Add</button></div>'
  html += step(2, builtInTeam || !!team, 'Find your team', builtInTeam || team ? '' : 'Optional',
    fromIndex ? 'Set up from your Team sync file: ' + esc(team ? teamName(team) : 'your team') + '’s folders are already known.' :
    builtInTeam ? 'Set up for you: Showroom already knows your team’s folders.' : team ? '<b>' + esc(teamName(team)) + '</b>' + (ts && ts.folders ? ' · ' + ts.folders.length + ' folders found' : ' · searching…') : 'Paste your team’s link (from Figma’s file browser) so Showroom can find campaign frames in every folder.', body2)

  // 3. Team sync
  let body3 = ''
  if (!idx) {
    if (TEAM_PRESETS.length) body3 += '<div class="ob-desc">Which team are you on?</div>' + presetPicker('ob-preset-')
    body3 += '<div class="row"><input class="field" id="ob-index" placeholder="' + (TEAM_PRESETS.length ? 'Or paste a Team sync file link' : 'figma.com/design/…/Showroom-Index') + '" aria-label="Index file link"><button class="btn" id="ob-index-add"' + (S.token ? '' : ' disabled') + '>Add</button></div>'
    body3 += '<details class="ob-desc"><summary style="cursor:pointer">Don’t have one? How to set it up</summary><ol class="steps" style="margin-top:6px">' +
      '<li>Make a new design file called “Showroom Index – your team” in a folder everyone on the team can edit.</li>' +
      '<li>Paste its link here. Showroom fills it in the first time someone connects.</li>' +
      '<li>In Settings › Team sync, click <b>Save</b> to store your team and folders in it.</li>' +
      '<li>Share the link (or ask whoever maintains Showroom to add it to the team list). Teammates then only need their token.</li></ol></details>'
  }
  html += step(3, !!idx, 'Turn on Team sync', idx ? '' : 'Optional · Enterprise',
    idx ? (S.index.error ? '<span style="color:var(--danger)">' + esc(S.index.error) + '</span>' : 'On' + (TEAM.indexFile ? ', set up for you' : '') + '. Campaign changes reach everyone within a minute.') : 'Link a shared “Showroom Index” file the team can edit. Changes then reach everyone within a minute.', body3)

  html += '<div class="row" style="margin-top:2px"><button class="btn primary grow" id="ob-start"' + (S.token ? '' : ' disabled') + '>Start using Showroom</button><button class="btn ghost" id="ob-skip">Skip for now</button></div>'
  html += '</div></div></div>'
  $('app').innerHTML = html

  const on = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn) }
  on('ob-connect', 'click', async () => {
    const token = $('ob-token').value.trim()
    if (!token) { $('ob-token').focus(); return }
    S.ob.error = ''
    const btn = $('ob-connect'); btn.disabled = true; btn.textContent = 'Checking…'
    try {
      const me = await testToken(token)
      S.prefs.me = { handle: me.handle, email: me.email, img: me.img_url || '' }
      send('save-prefs', { prefs: { me: S.prefs.me } })
      send('save-token', { token: token })
      S.token = token
      renderWelcome()
      checkAccess()
    } catch (e) { S.ob.error = e.kind === 'forbidden' ? 'Figma didn’t accept that token. Check it was copied in full.' : e.message; renderWelcome() }
  })
  on('ob-token', 'keydown', (e) => { if (e.key === 'Enter') $('ob-connect').click() })
  on('ob-check', 'click', () => checkAccess())
  on('ob-team-add', 'click', () => {
    const t = parseTeamLink($('ob-team').value)
    if (!t) { toast('Paste a team link, like figma.com/files/team/123456/Marketing', true); return }
    S.prefs.team = t; send('save-prefs', { prefs: { team: t } })
    renderWelcome()
    discover({ teamOnly: true }).then(() => { if (S.view === 'welcome') checkAccess() })
  })
  bindPresets(() => { if (S.view === 'welcome') { renderWelcome(); checkAccess() } })
  on('ob-index-add', 'click', () => {
    const f = parseFileLink($('ob-index').value)
    if (!f) { toast('Paste the index file’s link (Share › Copy link).', true); return }
    S.prefs.index = f
    S.index = { files: {}, vars: {}, colId: '', modeId: '', readAt: 0, error: '', writeError: '', canWrite: null, pauseUntil: 0 }
    send('save-prefs', { prefs: { index: f } })
    renderWelcome()
    pollIndex().then(() => { if (S.view === 'welcome') checkAccess() })
  })
  const finish = () => {
    S.prefs.onboarded = true
    send('save-prefs', { prefs: { onboarded: true } })
    S.view = !S.data.activeCampaignId && allCampaigns().length > 1 ? 'home' : 'panel'
    render()
    if (S.token && canSearch() && searchIsStale()) discover()
  }
  on('ob-start', 'click', finish)
  on('ob-skip', 'click', finish)
}

// ---------- FigJam boards ----------
// In FigJam the panel offers "Send to board" (places every frame at real or half size, grouped by
// channel, with live links and optional embeds) and "Sync board" (swaps in new renders in place,
// updates names and statuses, puts new frames in an Inbox). The placing happens in code.js.
function boardOpts() { return Object.assign({ embeds: 'file', scale: 1 }, S.prefs.boardOpts || {}) }
function boardCard(c) {
  const info = (S.boardInfo || {})[c.id]
  const o = boardOpts()
  const job = S.boardJob
  const seg = (key, options) => '<div class="seg">' + options.map((x) => '<button class="' + (String(o[key]) === String(x[0]) ? 'on' : '') + '" data-bopt="' + key + '" data-val="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>'
  let html = '<div class="stack"><div class="label" style="margin:0">This board</div>'
  if (info && info.count) {
    html += '<div class="card" style="padding:12px"><div style="font-weight:600">' + esc(c.name) + ' is on this board</div>'
    html += '<div class="muted small" style="margin-top:2px">' + info.count + ' frame' + (info.count === 1 ? '' : 's') + (info.syncedAt ? ' · synced ' + esc(ago(info.syncedAt)) : '') + '</div>'
    html += '<div class="muted small" style="margin-top:6px">Sync swaps in new versions where they are, updates names and statuses, and puts new frames in an Inbox. Nothing people moved or added is touched.</div></div>'
    html += '<button class="btn primary block" id="board-sync"' + (job || !S.token ? ' disabled' : '') + '>' + icon('refresh', 14) + (job ? esc(job) : 'Sync board') + '</button>'
    html += '<button class="btn ghost" id="board-send" style="align-self:flex-start;height:26px;padding:0 6px"' + (job ? ' disabled' : '') + '>Place another copy</button>'
  } else {
    html += '<div class="hint"><span class="ico">' + icon('wall') + '</span><div><div style="font-weight:600">Send ' + esc(c.name) + ' to this board</div><div class="muted small">Every frame, grouped by channel, with a live link to each. Arrange, sticky and stamp them like anything else on the board.</div></div></div>'
    html += '<div><div class="label">Size</div>' + seg('scale', [[1, 'Real size'], [0.5, 'Half size']]) + '</div>'
    html += '<div><div class="label">Live embeds</div>' + seg('embeds', [['file', 'One per file'], ['frame', 'One per frame'], ['none', 'None']]) + '</div>'
    html += '<button class="btn primary block" id="board-send"' + (job || !S.token || !c.items.length ? ' disabled' : '') + '>' + (job ? esc(job) : 'Send to board') + '</button>'
  }

}
// Makes sure every frame has a fresh render (same checks as the wall), then hands the list to code.js.
async function sendToBoard(mode) {
  const c = campaign(); if (!c || S.boardJob) return
  S.boardJob = 'Checking frames…'; render()
  await syncItems(c.items, { readFrames: mode === 'sync' ? 'always' : 'if-changed', forceRender: [], fullFile: true })
  const items = c.items.map((it) => {
    const n = nodeInfo(it) || {}
    return { id: it.id, fileKey: it.fileKey, nodeId: it.nodeId, name: n.name || it.name, channel: it.channel, fileName: (S.cache.files[it.fileKey] || {}).name || it.fileName,
      w: n.viewW || n.width || it.width, h: n.viewH || n.height || it.height, url: n.url || '', hash: n.hash || '', status: it.status || '' }
  })
  const missing = items.filter((it) => !it.url).length
  S.boardJob = mode === 'sync' ? 'Syncing…' : 'Placing ' + items.length + ' frames…'; render()
  const o = boardOpts()
  send(mode === 'sync' ? 'board-sync' : 'board-place', { campaignId: c.id, campaignName: c.name, items: items, embeds: o.embeds, scale: o.scale })
  if (missing) toast(missing + ' frame' + (missing === 1 ? '' : 's') + ' had no image yet and will show as grey boxes until the next sync.', true)
  setTimeout(() => { if (S.boardJob) { S.boardJob = null; render() } }, 120000)
}

// ---------- campaign home: every campaign as a card ----------
// People's Figma profile pictures, learned from frames they added and statuses they set.
const PHOTOS = {}
function avatar(name) {
  let h = 0; for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360
  const initials = name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('') || '?'
  const me = S.prefs && S.prefs.me
  const photo = PHOTOS[name] || (me && me.img && (me.handle === name) ? me.img : '')
  // Initials sit underneath; the photo covers them once it loads (and disappears if it can't).
  return '<span title="' + esc(name) + '" style="background:hsl(' + h + ' 52% 46%)">' + esc(initials) +
    (photo ? '<img src="' + esc(photo) + '" alt="" onerror="this.remove()">' : '') + '</span>'
}
function campaignStats(c) {
  const people = Array.from(new Set(c.items.map((it) => it.addedBy).filter(Boolean)))
  const files = new Set(c.items.map((it) => it.fileKey)).size
  const last = Math.max.apply(null, [0].concat(c.items.map((it) => Math.max(it.updatedAt || 0, it.statusAt || 0))))
  const channels = Array.from(new Set(c.items.map((it) => it.channel)))
  const thumbs = c.items.map((it) => (nodeInfo(it) || {}).url).filter(Boolean).slice(0, 4)
  return { people: people, files: files, last: last, channels: channels, thumbs: thumbs }
}

// Groups for the wall's rows: by channel (in the channel list's order), by file, or one group.
function wallGroups(c, by) {
  const groups = wallGroupsRaw(c, by)
  const mode = subMode(wallView())
  if (mode === 'off') return groups
  return groups.map((g) => {
    const order = [], byKey = {}
    for (const it of g.items) { const k = clusterOf(it, mode).key; if (!byKey[k]) { byKey[k] = []; order.push(k) } byKey[k].push(it) }
    return Object.assign({}, g, { items: [].concat.apply([], order.map((k) => byKey[k])), clusters: order.length, mode: mode })
  }).map((g, i, all) => {
    // Sections only add something when a row mixes files (or channels/pages); rows from a single file
    // stay plain (each frame's info line already names its file), which keeps the wall compact.
    g.clustered = g.clusters > 1
    return g
  })
}
function wallGroupsRaw(c, by) {
  c = Object.assign({}, c, { items: orderItems(c) })
  if (by === 'none') return [{ label: '', items: c.items.slice() }]
  if (by === 'file') {
    const order = []
    const byKey = {}
    for (const it of c.items) {
      if (!byKey[it.fileKey]) { const fc = S.cache.files[it.fileKey]; byKey[it.fileKey] = { label: (fc && fc.name) || it.fileName || 'File', items: [] }; order.push(byKey[it.fileKey]) }
      byKey[it.fileKey].items.push(it)
    }
    return order.sort((a, b) => a.label.localeCompare(b.label))
  }
  const channels = S.data.channels.slice()
  c.items.forEach((it) => { if (channels.indexOf(it.channel) < 0) channels.push(it.channel) })
  return channels.map((ch) => ({ label: ch, items: c.items.filter((it) => it.channel === ch) })).filter((g) => g.items.length)
}

const SPACING = { tight: [32, 120], normal: [80, 240], roomy: [200, 480] }   // [gap between frames, gap between rows]
// Lays out the wall. Frame names, row headings and section names stay screen-sized, so the room they
// need in wall units depends on the zoom. zRef is the zoom the room is sized for: the fit-to-screen zoom,
// found by wallLayout() (a couple of passes, since the room changes the wall's size).
function layout(c, zRef) {
  const view = wallView()
  const sp = SPACING[view.spacing] || SPACING.normal
  const GAP = sp[0], LABEL = view.names ? 60 : 16, ROW_GAP = sp[1], MAX_ROW = 9000
  const z = Math.max(0.03, Math.min(1, zRef || 0.25)), px = (n) => Math.round(n / z)   // screen px → wall units
  // Sections (clusters within rows) are Figma-style boxes in wall units: padding around the frames, room
  // inside the top for the frame names, and the section's name sitting just above the box.
  const labelPx = !view.names ? 6 : (view.meta && z >= 0.18 ? 40 : 25)
  const SEC = { pad: px(16), top: px(labelPx + 12), title: px(30), between: Math.max(GAP * 2, px(40)) }
  const groups = []
  let y = 0
  let maxX = 0
  for (const src of wallGroups(c, view.group)) {
    const items = src.items
    const cl0 = !!src.clustered
    const above = cl0 ? SEC.title + SEC.top : LABEL          // from the row's top to the frames' top
    const below = cl0 ? SEC.pad : 0                          // under the frames, inside the section
    const g = { label: src.label, y: y + above, items: [], segments: [] }
    let x = 0, rowY = y + above, rowH = 0, seg = null, prevKey = null
    const close = () => { if (seg) { g.segments.push(seg); seg = null } }
    for (const it of items) {
      const n = nodeInfo(it)
      const w = Math.max(40, (n && (n.viewW || n.width)) || it.width || 400)
      const h = Math.max(40, (n && (n.viewH || n.height)) || it.height || 300)
      // Device frames on the wall: the frame keeps its place inside a bigger block (its chrome around it).
      const dev = view.devicePresent === 'wall' ? deviceFor(it) : 'none'
      const db = wallDevBox(dev, n, w, h)
      const ins = db ? db.ins : NO_INSETS
      const ow = w + ins.l + ins.r, oh = h + ins.t + ins.b
      const cl = cl0 ? clusterOf(it, src.mode) : null
      const newCluster = cl && prevKey !== null && cl.key !== prevKey
      if (newCluster && x > 0) x += SEC.between + SEC.pad * 2 - GAP
      if (x > 0 && x + ow > MAX_ROW) { close(); x = 0; rowY += rowH + below + (cl0 ? px(28) : GAP) + above; rowH = 0 }
      if (cl && (!seg || newCluster)) { close(); seg = { label: cl.label, x1: x, x2: x + ow, y: rowY, ids: [] } }
      g.items.push({ it: it, n: n, x: x + ins.l, y: rowY + ins.t, w: w, h: h, dev: db ? dev : 'none', db: db, ins: ins, oy: rowY, oh: oh })
      if (seg) { seg.x2 = x + ow; seg.ids.push(it.id) }
      x += ow + GAP; rowH = Math.max(rowH, oh); maxX = Math.max(maxX, x - GAP + (cl0 ? SEC.pad : 0))
      if (cl) prevKey = cl.key
    }
    close()
    // Sections in a row share its height (its tallest frame), so they line up.
    g.segments.forEach((sg) => {
      sg.h = Math.max.apply(null, g.items.filter((p) => p.oy === sg.y).map((p) => p.oh))
      sg.box = { x: sg.x1 - SEC.pad, y: sg.y - SEC.top, w: sg.x2 - sg.x1 + SEC.pad * 2, h: sg.h + SEC.top + SEC.pad }
    })
    groups.push(g)
    y = rowY + rowH + below + (cl0 ? Math.max(ROW_GAP * 0.6, px(36)) : ROW_GAP)
  }
  const lastGap = groups.length && groups[groups.length - 1].segments.length ? Math.max(ROW_GAP * 0.6, px(36)) : ROW_GAP
  return { groups: groups, width: maxX, height: Math.max(0, y - lastGap), zRef: z }
}
// The zoom fit() would pick for a layout.
function fitZoomFor(b) {
  const vp = $('viewport')
  const vw = (vp && vp.clientWidth) || 1200, vh = (vp && vp.clientHeight) || 750
  if (!b || !b.width) return 1
  const pad = 48, gutter = 150
  return Math.max(0.02, Math.min(1, Math.min((vw - pad * 2 - gutter) / b.width, (vh - pad * 2) / b.height)))
}
function wallLayout(c) {
  let L = layout(c, 0.25)
  for (let i = 0; i < 3; i++) {
    const z = fitZoomFor(L)
    if (Math.abs(z - L.zRef) / L.zRef < 0.05) break
    L = layout(c, z)
  }
  return L
}

function renderWall() {
  if (S.view !== 'wall') return
  const c = campaign()
  const world = $('world'); if (!world) return
  const banner = $('banner')
  banner.innerHTML = S.wall.banner ? '<div class="notice ' + (S.wall.banner.kind === 'error' ? 'error' : 'warn') + '">' + esc(S.wall.banner.text) + '</div>' : ''
  if (!c || !c.items.length) { world.innerHTML = ''; banner.innerHTML = '<div class="notice">No frames in this campaign yet.</div>'; renderWallBar(); return }
  const L = wallLayout(c)
  S.wall.bounds = L
  S.wall.selected = S.wall.selected.filter((id) => c.items.some((it) => it.id === id))
  let html = ''
  for (const g of L.groups) {
    const gi = L.groups.indexOf(g)
    ;(g.segments || []).forEach((sg, si) => {
      const b = sg.box
      html += '<div class="sec" style="left:' + b.x + 'px;top:' + b.y + 'px;width:' + b.w + 'px;height:' + b.h + 'px;--w:' + b.w + '">' +
        '<div class="sec-t" data-seg="' + gi + ':' + si + '" title="Select the ' + sg.ids.length + ' frame' + (sg.ids.length === 1 ? '' : 's') + ' in ' + esc(sg.label) + '">' + esc(sg.label) + '</div></div>'
    })
    if (g.label) html += '<div class="ch" data-group="' + L.groups.indexOf(g) + '" title="Select all ' + esc(g.label) + ' frames" style="top:' + g.y + 'px">' + esc(g.label) + '<em>' + g.items.length + ' frame' + (g.items.length === 1 ? '' : 's') + '</em></div>'
    for (const p of g.items) {
      const it = p.it, n = p.n
      const fc = S.cache.files[it.fileKey] || {}
      const name = n && n.name ? n.name : it.name
      let body
      if (n && n.missing) body = '<div class="ph">Not found in its file. It may have been deleted.</div>'
      else if (n && n.url) body = '<img src="' + esc(n.url) + '" alt="' + esc(name) + '" draggable="false">'
      else if (fc.error) body = '<div class="ph">' + esc(fc.error) + '</div>'
      else if (n && n.renderFailed) body = '<div class="ph">Figma couldn’t render this frame.</div>'
      else body = S.token ? skeleton(PHASE_TEXT[S.wall.phase[it.id]] || PHASE_TEXT.queued) : '<div class="ph">Connect Figma to see this</div>'
      // While the rendered image downloads, keep the skeleton underneath and fade the image in.
      if (n && n.url && !n.missing && !S.wall.loaded[n.url]) body = skeleton(PHASE_TEXT.image) + body.replace('<img ', '<img class="ld" ')
      const meta = (fc.name || it.fileName) + (fc.lastTouchedAt ? ' · file edited ' + ago(fc.lastTouchedAt) + (fc.lastTouchedBy ? ' by ' + fc.lastTouchedBy : '') : '')
      const edge = n && n.url && n.viewW && (Math.abs(n.viewW - n.width) > 1 || Math.abs(n.viewH - n.height) > 1)
        ? '<div class="edgewrap">' + fadeBands(p.w, p.h, n.offX, n.offY, n.width, n.height) + '<div class="edge" style="left:' + n.offX + 'px;top:' + n.offY + 'px;width:' + n.width + 'px;height:' + n.height + 'px"></div></div>' : ''
      // Round the tile like the frame, unless content spills past the frame's edges (then the tile is bigger than the frame).
      const play = n && n.proto && !n.missing ? '<button class="pb" data-play="' + esc(it.id) + '" title="Play the live prototype" aria-label="Play the live prototype">' + icon('play', 13) + '</button>' : ''
      const dvc = p.db ? wallDeviceHTML(p.dev, it, n, p.db, p.w, p.h) : ''
      const dvs = dvc ? ';--dvt:' + p.ins.t + 'px;--dvl:' + p.ins.l + 'px;--dvr:' + p.ins.r + 'px' : ''
      // In a device the page has square corners (the device's screen shapes it).
      const radius = n && n.radius && !edge && !dvc ? ';border-radius:' + n.radius : ''
      html += '<div class="fr' + (dvc ? ' wdv-on dev-' + p.dev : '') + (play ? ' hasproto' : '') + (S.wall.selected.indexOf(it.id) >= 0 ? ' sel' : '') + (n && n.missing ? ' missing' : '') + (matchesFilter(it) ? '' : ' dim') + (S.wall.present && S.wall.present.id === it.id ? ' cur' : '') + '" data-id="' + esc(it.id) + '" style="left:' + p.x + 'px;top:' + p.y + 'px;width:' + p.w + 'px;height:' + p.h + 'px;--w:' + (p.w + (dvc ? p.ins.l + p.ins.r : 0)) + radius + dvs + '">' + dvc
      html += '<div class="lbl"><div class="nm">' + statusBadge(it.status) + (isUpdated(it) ? '<span class="upd">Updated</span>' : '') + esc(name) + '</div><div class="mt">' + esc(meta) + '</div></div>' + body + edge + play + '</div>'
    }
  }
  world.innerHTML = html
  bindImageEvents(world)
  renderFilterPill(c)
  animateWall(L, c)
  if (!S.wall.fitted) { if (!restorePosition(c.id)) fit(); S.wall.fitted = true } else applyTransform()
  syncLive()
  renderInspector()
  renderWallBar()
  // Frames added since the last check (by you in another window, or a teammate) load on their own.
  if (S.wall.synced && c.items.some((it) => needsImage(it) && !S.wall.tried[it.id])) setTimeout(loadMissing, 50)
}

// Four bands that cover everything in a tile outside the frame's own box (for the fade).
function fadeBands(W, H, x, y, w, h) {
  const band = (l, t, bw, bh) => bw > 0 && bh > 0 ? '<div class="fd" style="left:' + l + 'px;top:' + t + 'px;width:' + bw + 'px;height:' + bh + 'px"></div>' : ''
  return band(0, 0, W, y) + band(0, y + h, W, H - y - h) + band(0, y, x, h) + band(x + w, y, W - x - w, h)
}

// Image load/error events don't bubble, so listen on the world in the capture phase (once).
function bindImageEvents(world) {
  if (world.dataset.imgEvents) return
  world.dataset.imgEvents = '1'
  world.addEventListener('load', (e) => {
    const img = e.target
    if (!img || img.tagName !== 'IMG') return
    S.wall.loaded[img.getAttribute('src')] = true
    img.classList.remove('ld')
    const sk = img.parentNode && img.parentNode.querySelector('.sk')
    if (sk) setTimeout(() => sk.remove(), 320)
  }, true)
  world.addEventListener('error', (e) => {
    const img = e.target
    if (!img || img.tagName !== 'IMG') return
    // Usually an expired image link. Ask Figma for a fresh render, once per frame per visit.
    const tile = img.closest('.fr'); const id = tile && tile.dataset.id
    const c = campaign(); const it = c && c.items.find((x) => x.id === id); const n = it && nodeInfo(it)
    if (!it || !n || S.wall.retried[id]) { const sk = tile && tile.querySelector('.sk .tx'); if (sk) sk.textContent = 'Image didn’t load. Try Refresh.'; return }
    S.wall.retried[id] = true
    delete S.wall.tried[id]
    n.url = ''; n.urlAt = 0
    renderWall()
  }, true)
}

function applyTransform() {
  const world = $('world'); if (!world) return
  const z = S.wall.zoom
  const t = 'translate(' + S.wall.tx + 'px,' + S.wall.ty + 'px) scale(' + z + ')'
  world.style.transform = t
  const live = $('live'); if (live) live.style.transform = t
  const zv = $('zoom-val'); if (zv) zv.textContent = Math.round(z * 100) + '%'
  // While moving, the layers stay on the GPU (smooth); a moment after you stop they're redrawn sharp.
  world.classList.add('moving'); if (live) live.classList.add('moving')
  clearTimeout(S.wall.movingTimer)
  S.wall.movingTimer = setTimeout(() => { const w = $('world'), l = $('live'); if (w) w.classList.remove('moving'); if (l) l.classList.remove('moving') }, 180)
  // Labels, headings and the grid follow the zoom once per screen refresh, not on every wheel event.
  if (!S.wall.styleQueued) {
    S.wall.styleQueued = true
    const run = () => { S.wall.styleQueued = false; applyZoomStyles() }
    if (window.requestAnimationFrame) requestAnimationFrame(run); else setTimeout(run, 16)
  }
  rememberPosition()
}
function applyZoomStyles() {
  const world = $('world'); if (!world) return
  const z = S.wall.zoom
  if (world.style.getPropertyValue('--z') !== String(z)) {
    world.style.setProperty('--inv', String(1 / z))
    world.style.setProperty('--z', String(z))
    world.classList.toggle('far', z < 0.18)
    const live = $('live'); if (live) live.style.setProperty('--inv', String(1 / z))
  }
  moveGrid()
}

// The dot grid sits in wall units, like Figma's canvas: a spacing of 10 × 2ⁿ wall units chosen so the dots
// are 12–24 px apart on screen, plus a coarser layer at twice that. The fine layer fades in as it opens up.
function moveGrid() {
  const grid = $('grid'); if (!grid) return
  const z = S.wall.zoom || 1
  let g = 10
  while (g * z < 12) g *= 2
  while (g * z >= 24) g /= 2
  const s1 = g * z
  const tx = S.wall.tx, ty = S.wall.ty
  const fine = grid.children[0], coarse = grid.children[1]
  fine.style.backgroundSize = s1 + 'px ' + s1 + 'px'
  fine.style.backgroundPosition = (tx - s1 / 2) + 'px ' + (ty - s1 / 2) + 'px'
  fine.style.opacity = String(Math.max(0, Math.min(1, (s1 - 12) / 8)))
  coarse.style.backgroundSize = (s1 * 2) + 'px ' + (s1 * 2) + 'px'
  coarse.style.backgroundPosition = (tx - s1) + 'px ' + (ty - s1) + 'px'
}

function fit() {
  const vp = $('viewport'); const b = S.wall.bounds
  if (!vp || !b || !b.width) return applyTransform()
  const pad = 48, gutter = 150   // gutter: room for channel names, which stay screen-sized
  const z = fitZoomFor(b)
  S.wall.zoom = z
  S.wall.tx = Math.round(gutter + Math.max(0, (vp.clientWidth - gutter - pad - b.width * z) / 2))
  S.wall.ty = Math.round(pad)
  applyTransform()
}

function zoomAt(factor, cx, cy) {
  S.wall.touched = true
  const z0 = S.wall.zoom
  const z = Math.max(0.02, Math.min(4, z0 * factor))
  S.wall.tx = cx - (cx - S.wall.tx) * (z / z0)
  S.wall.ty = cy - (cy - S.wall.ty) * (z / z0)
  S.wall.zoom = z
  applyTransform()
}

  } else {
    html += '<div class="row" style="align-items:flex-start"><div class="grow"><div style="font-weight:600;font-size:13px">' + items.length + ' frames selected</div>'
    const names = items.slice(0, 3).map((it) => esc((nodeInfo(it) || {}).name || it.name)).join(', ')
    html += '<div class="muted small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + names + (items.length > 3 ? ' +' + (items.length - 3) + ' more' : '') + '</div></div>'
    html += '<button class="icon" id="insp-close" aria-label="Clear selection">' + icon('x', 14) + '</button></div>'
    const channels = Array.from(new Set(items.map((it) => it.channel)))
    html += '<div style="margin-top:10px"><label class="label" for="insp-channel">Channel</label>' + channelSelect(channels.length === 1 ? channels[0] : '') + '</div>'
    html += statusControl(items)
    html += deviceControl(items)
    html += '<div class="row" style="margin-top:10px"><button class="btn primary grow" id="insp-refresh" title="Reload these frames from their files now"' + busy + '>' + icon('refresh', 14) + 'Refresh ' + items.length + ' frames</button></div>'
    html += '<button class="btn ghost danger" id="insp-remove" style="margin-top:4px;padding:0 4px">Remove ' + items.length + ' from campaign</button>'
  }
  box.innerHTML = html
  box.classList.remove('hidden')
  const ids = items.map((it) => it.id)
  $('insp-close').addEventListener('click', () => setSelection([]))
  const open = $('insp-open'); if (open) open.addEventListener('click', () => openItem(ids[0]))
  $('insp-refresh').addEventListener('click', () => refreshSelected())
  const chSel = $('insp-channel'); if (chSel) chSel.addEventListener('change', (e) => { if (e.target.value) send('set-channel', { campaignId: c.id, itemIds: ids, channel: e.target.value }) })
  const hist = $('insp-history'); if (hist) hist.addEventListener('click', () => openHistory(items[0]))
  const play = $('insp-play'); if (play) play.addEventListener('click', () => { if (S.wall.live && S.wall.live.id === items[0].id) stopLive(); else playInPlace(items[0].id) })
  const playL = $('insp-play-large'); if (playL) playL.addEventListener('click', () => { stopLive(); openPlayer(items[0]) })
  box.querySelectorAll('[data-status]').forEach((el) => el.addEventListener('click', () => setStatus(ids, el.dataset.status)))
  box.querySelectorAll('[data-device]').forEach((el) => el.addEventListener('click', () => setDevice(ids, el.dataset.device)))
  $('insp-remove').addEventListener('click', (e) => {
    const b = e.currentTarget
    if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Click again to confirm'; return }
    setSelection([])
    send('remove-item', { campaignId: c.id, itemIds: ids })
  })
}

// ---------- prototype player (TEST) ----------
// Plays a frame's live Figma prototype inside the plugin, using Figma's own embed with its
// interface hidden. This is a test of whether embeds work inside the plugin window at all
// (mainly: does it know you're signed in, so private files load?). Two embed styles to compare:
//  - 'kit2': the current one, embed.figma.com/proto/…
//  - 'legacy': the older figma.com/embed?url=… wrapper, which may handle sign-in differently.
// scaling: 'contain' fits the prototype to the window (the Large window); 'min-zoom' is Figma's "Actual size",
// used on the wall so the prototype lines up exactly with the frame's image.
function protoUrl(it, style, scaling) {
  const nid = String(it.nodeId).replace(/:/g, '-')
  const sc = scaling || 'contain'
  if (style === 'legacy') {
    const inner = 'https://www.figma.com/proto/' + it.fileKey + '/?node-id=' + nid + '&starting-point-node-id=' + nid + '&hide-ui=1&hotspot-hints=0&scaling=' + sc
    return 'https://www.figma.com/embed?embed_host=showroom&url=' + encodeURIComponent(inner)
  }
  return 'https://embed.figma.com/proto/' + it.fileKey + '/?node-id=' + nid + '&starting-point-node-id=' + nid +
    '&embed-host=showroom&footer=false&viewport-controls=false&hotspot-hints=false&device-frame=false&scaling=' + sc + '&content-scaling=fixed'
}
// On the wall the prototype plays at real size in an embed a little bigger than the frame, cropped to the
// frame's exact box, so whatever space Figma's viewer leaves around a prototype is hidden.
const LIVE_MARGIN = 120
function openPlayer(it, style) {
  const box = $('player'); if (!box || !it) return
  style = style || protoStyle()
  S.player = { it: it, style: style, at: Date.now() }
  const name = (nodeInfo(it) || {}).name || it.name
  const tab = (v, label) => '<button class="' + (style === v ? 'on' : '') + '" data-pstyle="' + v + '">' + label + '</button>'
  box.innerHTML = '<div class="pl-bar"><div class="grow" style="min-width:0"><div class="pl-name">' + icon('play', 12) + esc(name) + '</div>' +
      '<div class="muted small">Live prototype from Figma. Click through it as you would in Figma’s presentation view.</div></div>' +
      '<div class="seg" style="width:auto" title="Clean: no Figma controls. With controls: Figma’s back, forward and restart buttons.">' + tab('legacy', 'Clean') + tab('kit2', 'With controls') + '</div>' +
      '<button class="icon" id="pl-restart" title="Restart the prototype" aria-label="Restart the prototype">' + icon('refresh') + '</button>' +
      '<button class="icon" id="pl-browser" title="Open the prototype in your browser" aria-label="Open the prototype in your browser">' + icon('ext') + '</button>' +
      '<button class="icon" id="pl-close" title="Close (Esc)" aria-label="Close">' + icon('x') + '</button></div>' +
    '<div class="pl-stage"><div class="pl-wait" id="pl-wait">Loading the prototype from Figma…</div>' +
      '<iframe id="pl-frame" src="' + esc(protoUrl(it, style)) + '" allow="fullscreen; clipboard-write" allowfullscreen referrerpolicy="origin"></iframe></div>'
  box.classList.remove('hidden')
  $('pl-frame').addEventListener('load', () => { const w = $('pl-wait'); if (w) w.textContent = 'Loaded. If nothing shows, try the other embed style.'; $('pl-frame').classList.add('in') })
  // The embed's own page never tells the plugin whether it worked, so say so if it's slow.
  setTimeout(() => { const w = $('pl-wait'); if (S.player && S.player.it === it && w && !$('pl-frame').classList.contains('in')) w.textContent = 'Still loading… If this never finishes, the plugin may be blocked from showing Figma embeds.' }, 15000)
  box.querySelectorAll('[data-pstyle]').forEach((b) => b.addEventListener('click', () => {
    setWallView({ protoStyle: b.dataset.pstyle })
    openPlayer(it, b.dataset.pstyle)
  }))
  $('pl-restart').addEventListener('click', () => openPlayer(it, style))
  $('pl-browser').addEventListener('click', () => send('open-item', { fileKey: it.fileKey, nodeId: it.nodeId, proto: true }))
  $('pl-close').addEventListener('click', closePlayer)
}
function closePlayer() {
  const box = $('player'); if (!box) return
  box.classList.add('hidden'); box.innerHTML = ''   // removing the iframe stops the prototype
  S.player = null
}

// ---------- live prototypes on the wall ----------
// ▶ on a frame (or Play prototype in its details) plays its live Figma prototype right where the frame
// sits. The embed lives in #live, a layer that pans and zooms with the wall but is never redrawn, so
// wall updates (Team sync, other windows) don't reload it. Only one plays at a time: each embed is a
// full Figma viewer. In Present, prototype frames play by themselves (View options › Prototypes).
function hasProto(it) { const n = it && nodeInfo(it); return !!(n && n.proto && !n.missing) }
function protoStyle() { return wallView().protoStyle || 'legacy' }
// Where the live prototype sits: the frame's own box, not the render bounds (content outside it isn't part of the prototype).
function liveBox(p) {
  const n = p.n || nodeInfo(p.it) || {}
  return { x: p.x + (n.offX || 0), y: p.y + (n.offY || 0), w: n.width || p.w, h: n.height || p.h }
}
function playInPlace(id, opts) {
  opts = opts || {}
  const p = placementOf(id); const layer = $('live')
  if (!p || !layer) return
  stopLive(true)
  const b = liveBox(p)
  if (!opts.noZoom) zoomToRect(b.x, b.y, b.w, b.h, { maxZoom: 1, pad: 56 })
  const box = document.createElement('div')
  box.className = 'lv'; box.dataset.id = id
  box.style.cssText = 'left:' + b.x + 'px;top:' + b.y + 'px;width:' + b.w + 'px;height:' + b.h + 'px'
  box.innerHTML = '<div class="lv-bar"><span title="Live prototype">Live · ' + esc((p.n && p.n.name) || p.it.name) + '</span><button class="lv-restart" title="Restart">' + icon('refresh', 12) + '</button>' +
    '<button class="lv-large" title="Play in a large window">' + icon('fit', 12) + 'Large</button><button class="lv-stop" title="Stop (Esc)">' + icon('x', 12) + 'Stop</button></div>' +
    '<div class="lv-wait" style="font-size:calc(14px * var(--inv))">' + skeleton('Loading the prototype…') + '</div>' +
    '<div class="lv-crop"><iframe src="' + esc(protoUrl(p.it, protoStyle(), 'min-zoom')) + '" style="left:' + (-LIVE_MARGIN) + 'px;top:' + (-LIVE_MARGIN) + 'px;width:' + (b.w + LIVE_MARGIN * 2) + 'px;height:' + (b.h + LIVE_MARGIN * 2) + 'px" allow="fullscreen; clipboard-write" allowfullscreen referrerpolicy="origin" title="Live prototype"></iframe></div>'
  layer.appendChild(box)
  const frame = box.querySelector('iframe')
  frame.addEventListener('load', () => { frame.classList.add('in'); setTimeout(() => { const w = box.querySelector('.lv-wait'); if (w) w.remove() }, 320) })
  box.querySelector('.lv-stop').addEventListener('click', () => stopLive())
  box.querySelector('.lv-restart').addEventListener('click', () => playInPlace(id, { noZoom: true }))
  box.querySelector('.lv-large').addEventListener('click', () => { stopLive(); openPlayer(p.it) })
  S.wall.live = { id: id }
  document.querySelectorAll('#world .fr').forEach((el) => el.classList.toggle('playing', el.dataset.id === id))
  hudSync()
  if (!opts.quiet) renderInspector()
}
function stopLive(quiet) {
  if (!S.wall.live) return
  const layer = $('live'); if (layer) layer.innerHTML = ''   // removing the iframe stops the prototype
  S.wall.live = null
  document.querySelectorAll('#world .fr.playing').forEach((el) => el.classList.remove('playing'))
  hudSync()
  if (!quiet) renderInspector()
}
// After the wall redraws: keep the live prototype on its frame, or stop it if the frame is gone or filtered out.
function syncLive() {
  const live = S.wall.live; if (!live) return
  const p = placementOf(live.id)
  const box = document.querySelector('#live .lv')
  if (!p || !box || !matchesFilter(p.it)) { stopLive(true); return }
  const b = liveBox(p)
  box.style.left = b.x + 'px'; box.style.top = b.y + 'px'; box.style.width = b.w + 'px'; box.style.height = b.h + 'px'
  const fr = box.querySelector('iframe'); if (fr) { fr.style.width = (b.w + LIVE_MARGIN * 2) + 'px'; fr.style.height = (b.h + LIVE_MARGIN * 2) + 'px' }
  const tile = document.querySelector('#world .fr[data-id="' + live.id.replace(/"/g, '') + '"]'); if (tile) tile.classList.add('playing')
}

// ---------- history panel ----------
function openHistory(item) {
  S.historyRenders = S.historyRenders || {}
  S.history = { item: item, versions: [], next: '', loading: false, error: '', pick: '', view: 'then', renders: S.historyRenders }
  renderHistory()
  loadVersions(item.fileKey, false)
}

function renderHistory() {
  const box = $('history'); if (!box) return
  const h = S.history
  if (!h || S.view !== 'wall') { box.classList.add('hidden'); box.innerHTML = ''; return }
  const n = nodeInfo(h.item) || {}
  const name = n.name || h.item.name
  const fmt = (t) => { const d = new Date(t); return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ', ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) }
  let html = '<div class="row" style="align-items:flex-start"><div class="grow"><div style="font-weight:600;font-size:13px">History</div><div class="muted small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(name) + '</div></div><button class="icon" id="hist-close" aria-label="Close history">' + icon('x', 14) + '</button></div>'
  // preview
  const r = h.pick ? h.renders[h.item.nodeId + '@' + h.pick] : null
  const nowUrl = n.url
  html += '<div class="hist-preview">'
  if (!h.pick) html += '<div class="muted small hist-empty">Pick a version to see this frame as it was then.</div>'
  else if (h.rendering) html += '<div class="muted small hist-empty">Rendering…</div>'
  else if (h.view === 'now') html += nowUrl ? '<img src="' + esc(nowUrl) + '" alt="' + esc(name) + ' now">' : '<div class="muted small hist-empty">No current image yet.</div>'
  else if (r && r.url) html += '<img src="' + esc(r.url) + '" alt="' + esc(name) + ' in the chosen version">'
  else if (r && r.missing) html += '<div class="muted small hist-empty">This frame didn’t exist yet in that version, or Figma couldn’t render it.</div>'
  else if (r && r.error) html += '<div class="small hist-empty" style="color:var(--danger)">' + esc(r.error) + '</div>'
  html += '</div>'
  if (h.pick) {
    const v = h.versions.find((x) => x.id === h.pick)
    html += '<div class="row" style="margin-top:8px;gap:6px"><div class="hist-seg" role="tablist"><button class="' + (h.view === 'then' ? 'on' : '') + '" id="hist-then" role="tab" aria-selected="' + (h.view === 'then') + '">' + (v ? esc(fmt(v.at)) : 'Then') + '</button><button class="' + (h.view === 'now' ? 'on' : '') + '" id="hist-now" role="tab" aria-selected="' + (h.view === 'now') + '">Now</button></div><span class="grow"></span><button class="btn ghost" id="hist-open" style="height:28px;padding:0 6px" title="Open this version in Figma">' + icon('ext', 13) + 'Open</button></div>'
  }
  // versions list
  html += '<div class="label" style="margin:12px 0 4px">Saved versions of “' + esc((S.cache.files[h.item.fileKey] || {}).name || h.item.fileName) + '”</div><div class="hist-list">'
  if (h.error) html += '<div class="notice error small">' + esc(h.error) + '</div>'
  for (const v of h.versions) {
    html += '<button class="hist-row' + (h.pick === v.id ? ' on' : '') + '" data-version="' + esc(v.id) + '"><span class="grow"><span class="nm">' + esc(v.label || 'Autosave') + '</span><span class="mt">' + esc(fmt(v.at)) + (v.user ? ' · ' + esc(v.user) : '') + '</span>' + (v.description ? '<span class="mt">' + esc(v.description) + '</span>' : '') + '</span></button>'
  }
  if (h.loading) html += '<div class="muted small" style="padding:8px 4px">Loading versions…</div>'
  else if (h.next) html += '<button class="btn ghost" id="hist-more" style="width:100%">Load older versions</button>'
  else if (!h.versions.length && !h.error) html += '<div class="muted small" style="padding:8px 4px">No saved versions found.</div>'
  html += '</div><div class="muted small" style="margin-top:8px">Figma saves versions as people work, not after every edit. Each preview is rendered by Figma on request.</div>'
  box.innerHTML = html
  box.classList.remove('hidden')
  $('hist-close').addEventListener('click', () => { S.history = null; renderHistory() })
  box.querySelectorAll('[data-version]').forEach((el) => el.addEventListener('click', () => showVersion(el.dataset.version)))
  const more = $('hist-more'); if (more) more.addEventListener('click', () => loadVersions(h.item.fileKey, true))
  const then = $('hist-then'); if (then) then.addEventListener('click', () => { h.view = 'then'; renderHistory() })
  const now = $('hist-now'); if (now) now.addEventListener('click', () => { h.view = 'now'; renderHistory() })
  const open = $('hist-open'); if (open) open.addEventListener('click', () => openItem(h.item.id, h.pick))
}

function bindWall() {
  $('wall-back').addEventListener('click', closeWall)
  $('wall-refresh').addEventListener('click', () => refreshWall('manual'))
  $('zoom-in').addEventListener('click', () => { const vp = $('viewport'); zoomAt(1.25, vp.clientWidth / 2, vp.clientHeight / 2) })
  $('zoom-out').addEventListener('click', () => { const vp = $('viewport'); zoomAt(0.8, vp.clientWidth / 2, vp.clientHeight / 2) })
  $('zoom-val').addEventListener('click', () => { const vp = $('viewport'); zoomAt(1 / S.wall.zoom, vp.clientWidth / 2, vp.clientHeight / 2) })
  $('zoom-fit').addEventListener('click', fit)
  $('view-opts').addEventListener('click', () => toggleViewOptions())
  $('filter-btn').addEventListener('click', () => toggleFilters())
  $('present-btn').addEventListener('click', () => startPresent())
  $('mark-seen').addEventListener('click', () => {
    const c = campaign(); const seen = {}
    c.items.forEach((it) => { const n = nodeInfo(it); if (n && n.hash) seen[it.id] = n.hash })
    send('mark-seen', { campaignId: c.id, seen: seen })
  })

  const vp = $('viewport')
  vp.addEventListener('wheel', (e) => {
    e.preventDefault()
    // In Present the device covers the wall: the wheel scrolls its page wherever the pointer is.
    if (S.wall.dev && S.wall.present) { devWheel(e); return }
    const r = vp.getBoundingClientRect()
    if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top)
    else { S.wall.touched = true; S.wall.tx -= e.deltaX; S.wall.ty -= e.deltaY; applyTransform() }
  }, { passive: false })

  let drag = null
  let lastClick = { id: '', at: 0 }
  const marquee = document.createElement('div')
  marquee.className = 'marquee hidden'
  vp.appendChild(marquee)
  vp.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 && e.button !== 1) return
    // Controls floating over the canvas handle their own clicks (capturing the pointer would swallow them).
    if (e.target.closest('#filterpill, #hud, #banner, #arrivals, #live, #dev')) return
    const pb = e.target.closest('.pb')
    if (pb) { e.preventDefault(); playInPlace(pb.dataset.play); return }
    const r = vp.getBoundingClientRect()
    const target = e.target.closest('.fr')
    // Dragging a frame moves it within its row; dragging empty space (or with Space held, or the
    // middle mouse button) pans. In Present mode everything pans.
    const pan = !target || e.button === 1 || S.wall.spaceDown || !!S.wall.present || target.classList.contains('dim')
    drag = { x: e.clientX, y: e.clientY, ox: e.clientX - r.left, oy: e.clientY - r.top, tx: S.wall.tx, ty: S.wall.ty, moved: false,
      target: target, heading: e.target.closest('.ch, .sec-t'), additive: e.shiftKey || e.metaKey || e.ctrlKey,
      box: e.shiftKey && !target && !S.wall.present, arrange: !pan && !(e.shiftKey || e.metaKey || e.ctrlKey) }
    vp.setPointerCapture(e.pointerId)
  })
  vp.addEventListener('pointermove', (e) => {
    if (!drag) return
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 3) {
      drag.moved = true
      if (drag.arrange) startArrange(drag)
      else if (!drag.box) vp.classList.add('panning')
    }
    if (!drag.moved) return
    if (drag.arrange) { moveArrange(drag, e); return }
    if (drag.box) {
      const x = Math.min(drag.ox, drag.ox + dx), y = Math.min(drag.oy, drag.oy + dy)
      marquee.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:' + Math.abs(dx) + 'px;height:' + Math.abs(dy) + 'px'
      marquee.classList.remove('hidden')
      // Frames the box touches light up, so you can see what will be selected before letting go.
      const hit = new Set(marqueeHits(drag, e))
      document.querySelectorAll('#world .fr').forEach((el) => el.classList.toggle('willsel', hit.has(el.dataset.id)))
      return
    }
    S.wall.touched = true; S.wall.tx = drag.tx + dx; S.wall.ty = drag.ty + dy; applyTransform()
  })
  // The frames a Shift-drag selection box touches (a frame's device counts as part of it).
  function marqueeHits(d, e) {
    const z = S.wall.zoom
    const x1 = (Math.min(d.ox, d.ox + e.clientX - d.x) - S.wall.tx) / z, x2 = (Math.max(d.ox, d.ox + e.clientX - d.x) - S.wall.tx) / z
    const y1 = (Math.min(d.oy, d.oy + e.clientY - d.y) - S.wall.ty) / z, y2 = (Math.max(d.oy, d.oy + e.clientY - d.y) - S.wall.ty) / z
    const hit = []
    for (const g of (S.wall.bounds || { groups: [] }).groups) for (const p of g.items) {
      const i = p.ins || NO_INSETS
      if (p.x - i.l < x2 && p.x + p.w + i.r > x1 && p.y - i.t < y2 && p.y + p.h + i.b > y1 && matchesFilter(p.it)) hit.push(p.it.id)
    }
    return hit
  }
  vp.addEventListener('pointerup', (e) => {
    if (!drag) return
    vp.classList.remove('panning')
    const d = drag
    drag = null
    if (d.arrange && d.moved) { endArrange(d, e); return }
    if (d.box && d.moved) {
      marquee.classList.add('hidden')
      document.querySelectorAll('#world .fr.willsel').forEach((el) => el.classList.remove('willsel'))
      setSelection(Array.from(new Set(S.wall.selected.concat(marqueeHits(d, e)))))
      return
    }
    if (d.moved) return
    if (d.heading) {
      const c = campaign()
      const groups = (S.wall.bounds && S.wall.bounds.groups) || []
      let ids
      if (d.heading.dataset.seg) {
        // A section's name selects the frames in that section.
        const [gi, si] = d.heading.dataset.seg.split(':').map(Number)
        const sg = groups[gi] && groups[gi].segments[si]
        ids = sg ? groups[gi].items.filter((p) => sg.ids.indexOf(p.it.id) >= 0 && matchesFilter(p.it)).map((p) => p.it.id) : []
      } else {
        const group = groups[Number(d.heading.dataset.group)] || { items: [] }
        ids = group.items.filter((p) => matchesFilter(p.it)).map((p) => p.it.id)
      }
      setSelection(d.additive ? Array.from(new Set(S.wall.selected.concat(ids))) : ids)
      return
    }
    const id = d.target ? d.target.dataset.id : ''
    const now = Date.now()
    if (id && !d.additive && lastClick.id === id && now - lastClick.at < 400) { lastClick = { id: '', at: 0 }; openItem(id); return }
    lastClick = { id: id, at: now }
    if (d.additive) {
      if (id) setSelection(S.wall.selected.indexOf(id) >= 0 ? S.wall.selected.filter((x) => x !== id) : S.wall.selected.concat(id))
      return
    }
    setSelection(id ? [id] : [])
  })
  // Plugin windows can't be dragged to resize, so this corner handle asks Figma to resize it.
  const grip = $('grip')
  let rs = null
  grip.addEventListener('pointerdown', (e) => { rs = { x: e.screenX, y: e.screenY, w: window.innerWidth, h: window.innerHeight }; grip.setPointerCapture(e.pointerId); e.stopPropagation() })
  grip.addEventListener('pointermove', (e) => {
    if (!rs) return
    const size = { width: Math.max(560, Math.round(rs.w + e.screenX - rs.x)), height: Math.max(400, Math.round(rs.h + e.screenY - rs.y)) }
    rs.last = size
    send('resize', size)
  })
  grip.addEventListener('pointerup', () => { if (rs && rs.last) { S.prefs.wallSize = rs.last; send('save-prefs', { prefs: { wallSize: rs.last } }) } rs = null })

  // Page-wide listeners: added once, not every time the wall opens.
  if (S.docBound) return
  S.docBound = true
  document.addEventListener('selectionchange', () => {
    if (S.view !== 'wall' || /INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || '')) return
    const sel = window.getSelection(); if (sel && sel.rangeCount && !sel.isCollapsed) sel.removeAllRanges()
  })
  // Clicking anywhere outside a popover closes it.
  document.addEventListener('pointerdown', (e) => {
    if (S.view !== 'wall') return
    const open = (id) => $(id) && !$(id).classList.contains('hidden')
    if (open('viewopts') && !e.target.closest('#viewopts, #view-opts')) toggleViewOptions(false)
    if (open('filters') && !e.target.closest('#filters, #filter-btn, #filterpill')) toggleFilters(false)
    if (open('shortcuts') && !e.target.closest('#shortcuts, #vo-keys')) toggleShortcuts(false)
  }, true)
  document.addEventListener('keydown', (e) => {
    if (S.view !== 'wall' || /INPUT|SELECT|TEXTAREA/.test((document.activeElement || {}).tagName || '')) return
    if (wallKey(e)) e.preventDefault()
  })
  document.addEventListener('keyup', (e) => {
    if (e.code === 'Space' && S.wall.spaceDown) { S.wall.spaceDown = false; const vp = $('viewport'); if (vp) vp.classList.remove('spacepan') }
  })
  // Present mode: show the controls again when the mouse moves, hide them after a moment.
  document.addEventListener('pointermove', () => { if (S.wall.present) wakeHud() })
}

// Another open copy of the plugin may have checked files more recently; keep whichever is newer.
function mergeCache(incoming) {
  for (const key of Object.keys(incoming.files)) {
    const mine = S.cache.files[key], theirs = incoming.files[key]
    if (!mine || (theirs.checkedAt || 0) > (mine.checkedAt || 0)) S.cache.files[key] = theirs
  }
}

// ---------- messages from code.js ----------
window.onmessage = (event) => {
  const msg = event.data && event.data.pluginMessage
  if (!msg) return
  if (msg.type === 'state') {
    const firstLoad = S.view === 'loading'
    S.data = msg.data; S.token = msg.token || ''; S.prefs = msg.prefs || {}; S.selection = msg.selection; S.file = msg.file
    S.editor = msg.editor || 'figma'; S.boardInfo = msg.board || null
    if (msg.boardResult) { S.boardJob = null }
    if (firstLoad) S.cache = msg.cache && msg.cache.files ? msg.cache : { files: {} }
    else if (msg.cache && msg.cache.files && !S.wall.busy) mergeCache(msg.cache)
    // Folder search results: take another window's newer results unless this window is searching.
    const incomingScan = msg.scan && msg.scan.files ? msg.scan : null
    if (incomingScan && (firstLoad || (!S.search.busy && (incomingScan.savedAt || 0) > (S.scan.savedAt || 0)))) S.scan = incomingScan
    rememberThisFile()
    syncLinks()
    queueIndexPublish()
    if (msg.message) toast(msg.message)
    if (firstLoad) {
      S.view = 'panel'
      if (!S.data.activeCampaignId && allCampaigns().length > 1) S.view = 'home'
      if (!S.prefs.onboarded) { S.view = 'welcome'; if (S.token) setTimeout(checkAccess, 400) }
      // Team sync first (one quick read), then the full search if it's due.
      setTimeout(async () => { await pollIndex(); if (S.token && canSearch() && searchIsStale()) discover() }, 300)
    }
    if (msg.external && S.view === 'setup') { renderSearchStatus(); return }
    if (S.view === 'wall') { renderWall(); return }
    if ((S.view === 'setup' || S.view === 'home') && document.activeElement && document.activeElement.tagName === 'INPUT') return
    render()
    return
  }
  if (msg.type === 'selection') {
    S.selection = msg.selection
    if (S.view === 'panel') render()
    return
  }
  if (msg.type === 'error') { toast(msg.message, true); if (S.boardJob) { S.boardJob = null; render() } }
}

window.showroomTest = { discover: discover, pollIndex: pollIndex, renderWall: renderWall, autoDevice: autoDevice, pageParts: pageParts }
setInterval(() => { pollIndex() }, INDEX_POLL)   // lets the automated tests run a search directly
send('init')
</script>
</body>
</html>
